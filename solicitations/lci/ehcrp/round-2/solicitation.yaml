# DR-0012 solicitation model. Sources are inventory asset ids.
id: lci-ehcrp-r2
funder: lci                      # Governor's Office of Land Use and Climate Innovation
program: Extreme Heat and Community Resilience Program (ICARP)
round: 2
# STANDARDS: every document that defines the bar this application must meet, whether or not it is the primary
# solicitation. Distinct from content sources (proposals, reports) that we draw prose/facts from.
# precedence: lower number wins on conflict; equal precedence → the newer document wins. Record conflicts in requirements.yaml.
standards:
  - {asset: ehcrp-r2-full-application-form, role: primary, precedence: 1, covers: "exact question wording, word limits, points"}
  - {asset: ehcrp-r2-faq, role: official-clarification, precedence: 2, covers: "staff answers that clarify or amend the guidelines (live; re-check before submission)"}
  - {asset: ehcrp-r2-guidelines, role: scoring-and-rules, precedence: 3, covers: "eligibility, budget rules, Appendix F scoring bands, Appendix B Belonging Guide, Appendix E priority points"}
  - {asset: ehcrp-r2-checklist-early, role: completeness-checklist, precedence: 3, covers: "required attachments and items for Early Infrastructure"}
  - {asset: ehcrp-r2-nofa, role: scoring-and-rules, precedence: 3, covers: "deadlines, amounts"}
  - {asset: ehcrp-r2-meaningful-direct-benefits, role: external-criteria, precedence: 3, covers: "the four meaningful-and-direct-benefit criteria behind the 15 funding-priority points (Guidelines §7.1 fn 2)"}
  - {asset: ehcrp-r2-ta-guide-harm-reduction, role: reviewer-guidance, precedence: 4, covers: "what reviewers look for: harm pathways, metrics (who/how/when)"}
  - {asset: ehcrp-r2-ta-guide-partnership, role: reviewer-guidance, precedence: 4}
  - {asset: ehcrp-r2-ta-guide-belonging, role: reviewer-guidance, precedence: 4}
  - {asset: ehcrp-r2-ta-guide-lasting-community-benefits, role: reviewer-guidance, precedence: 4}
  - {asset: ehcrp-r2-planning-playbook-guide, role: reviewer-guidance, precedence: 4, covers: "planning-document expectations (feeds lcb-q1 and overview)"}
  - {asset: ehcrp-r2-partnerships-guide, role: reviewer-guidance, precedence: 5}
  - {asset: ehcrp-r2-applicant-prep-guide, role: reviewer-guidance, precedence: 5}
  - {asset: vcp-bay-point-tracts, role: external-tool, precedence: 3, covers: "Vulnerable Communities Platform + Climate Bond DAC map designations used to award priority points (wanted)"}
  - {asset: ehcrp-r2-draft-guidelines, role: superseded, precedence: 9, covers: "diff only; never cite"}
# Context, not standards: prior-round documents (ehcrp-r1-*) show what was funded and what changed, but they do not bind R2.
deadlines:
  preapp_window_1: 2026-07-21T14:00:00-07:00
  preapp_window_2: 2026-08-11T14:00:00-07:00
  full_application: 2026-10-13T14:00:00-07:00
tiers:
  early-infrastructure: {award_min: 750000, award_max: 1200000, months: 30, deliverables: [planning-document, demonstration-project]}
  advanced-infrastructure: {award_min: 3000000, award_max: 4500000, months: 48, deliverables: [completed-infrastructure, future-implementation-playbook]}
budget_constraints:            # Guidelines §3.4 / §4.4
  early-infrastructure: {demonstration_pct: [25, 60], partners_min_pct: 8, belonging_min_pct: 4, post_award_setaside: 25000, indirect_max_pct: 15}
  advanced-infrastructure: {construction_min_pct: 70, partners_min_pct: 6, belonging_min_pct: 2, post_award_setaside: 50000, indirect_max_pct: 15}
scoring_total: 100             # narrative 55 + funding priority 15 + workbook 20 + interview 10
