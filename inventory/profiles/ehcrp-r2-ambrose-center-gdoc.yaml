- sid: s110
  path: Fresno EHCRP example > Local Knowledge > Hyphae has strong connections with local environmental justice coalitions and community-based organizations (CBOs), including the Central Valley-based California
    Environmental Justice Coalition (CEJC), Valley Improvements Project, Little Manila Rising, and Mayor Rey Leon’s Latino Equity Advocacy and Policy Institute (LEAP). This established network gives Hyphae
    a significant advantage in understanding regional needs and engaging stakeholders effectively. Current and ongoing collaborations across California provide a head start in developing the dispersed network
    of engaged community groups essential for the project’s success.
