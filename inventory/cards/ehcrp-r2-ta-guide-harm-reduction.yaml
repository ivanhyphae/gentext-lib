asset_id: ehcrp-r2-ta-guide-harm-reduction
card:
  summary: LCI program guidance on Harm Reduction as a core value for EHCRP Round 2 proposals. Defines harm reduction as infrastructure
    that directly interrupts the pathway between extreme heat and exposed populations. Provides framework questions on identifying
    specific harms, vulnerabilities, and pathways; lists data sources and assessment tools (CHAT, Cal Adapt, CalBRACE, CDPH
    Climate Vulnerability Visualizer, etc.) for evidence-building.
  doc_role: guidance
  authorship: LCI (Extreme Heat and Community Resilience Program)
  disposition: reference
  disposition_reason: Authoritative program guidance defining evaluation criteria and recommended data sources for Round 2
    applications. Essential reference for understanding harm-reduction question requirements (hr-q1, hr-q2), but not prose
    to extract or reuse directly.
  serves_needs:
  - need_id: hr-q1
    how: 'Defines elements: specific health impacts, exposure pathways, vulnerabilities, community-level evidence (data +
      local knowledge); frames lived experience and past heat events as valid evidence.'
  - need_id: hr-q2
    how: Requires pathway mapping from infrastructure to named harms and measurable outcomes; guides metric selection (who/how/when
      tracking).
  - need_id: ehcrp-r2-webinars-office-hours
    how: Is itself program guidance; complements but does not replace webinars or office-hours Q&A.
  sections:
  - sid: s3
    path: 'What You Need To Know: Understanding Harm Reduction as a Program Value'
    type: need-statement
    reuse_value: high
    note: 'Core definition: harm reduction = infrastructure that directly interrupts extreme-heat-to-people pathway; grounds
      in community health understanding and underlying causes.'
  - sid: s4
    path: 'What You Need To Know: Elements of Harm Reduction'
    type: method
    reuse_value: high
    note: 'Framework questions for hr-q1/hr-q2: identifying specific harms (health impacts, data sources, past events), vulnerabilities
      (exposure, community members), and pathways. Integrates data + local knowledge.'
  fact_candidates:
  - 's2: EHCRP Round 2 funds Early and Advanced Infrastructure projects'
  - 's2: Four program values required: Harm Reduction, Collaborative Partnerships, Belonging, Lasting Community Benefits'
  - 's3: Infrastructure must interrupt pathway between extreme heat and people most exposed'
  - 's4: Examples of specific health impacts include heat stroke, respiratory illness, mental health impacts'
  - 's9: CHAT (California Heat Assessment Tool) is a recommended data source'
  - 's10: CalBRACE Climate Change Toolkit is available'
  - 's13: Climate Change & Health Vulnerability Visualizer available from CDPH'
  - 's14: Climate Change & Health Profile Reports available from CDPH'
  flags:
  - Sections s5–s20 are mostly tool/resource listings with minimal text (mostly 'Click here' links); excerpts too thin to
    extract reuse value beyond names.
  - No specific Bay Point data, harm narratives, or community voices present—this is generic program guidance.
  - No contact data or internal notes detected.
