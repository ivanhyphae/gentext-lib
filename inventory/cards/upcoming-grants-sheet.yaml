asset_id: upcoming-grants-sheet
card:
  summary: 'Internal tracking spreadsheet of grant opportunities pipeline, partner organizations, and application statuses.
    Contains three sheets: (1) Upcoming opportunities with solicitation codes, due dates, partner coordination notes, and
    links to proposal drafts; (2) Active Potential Partners database with 59 organizations, contact details, geographic service
    areas, and mission statements; (3) Archive of EHCRP-interested organizations. Data current as of 2026-09-15. Modified
    dates show active use.'
  doc_role: working-doc
  authorship: Hyphae Design Lab (internal team)
  disposition: reference
  disposition_reason: Working pipeline tracker needed for coordination and partner relationship management. Solicitation links,
    due dates, and status flags are authoritative references. Partner organization database supports outreach and capability
    assessment. Not prose to reuse, but essential for operational context and opportunity tracking.
  serves_needs:
  - need_id: ehcrp-r2-webinars-office-hours
    how: Does not contain webinar materials; tracks opportunities but not TA resources
  - need_id: moodle-application-template
    how: References Moodle template in comments but does not contain the template itself
  sections:
  - path: 'Table Context > File Name: Upcoming Grants > Sheet Name: Upcoming opportunities'
    type: admin
    reuse_value: medium
    note: Live tracking of grant codes, solicitation links, due dates, status, next steps, partner coordination notes, and
      proposal folder locations; directly supports LCI EHCRP Round 2 and other active applications
  - path: 'Table Context > File Name: Upcoming Grants > Sheet Name: Active Potential Partners'
    type: partner-role
    reuse_value: medium
    note: Database of 59 partner organizations with addresses, counties, regions, contact persons, email, phone, service areas,
      missions, and programs; critical for partnership outreach and capability matching across Bay Area and beyond
  fact_candidates:
  - 'ARPAH opportunity due 9/14/2026 (Status: Missed)'
  - CRC (Community Resilience Centers Round 2 IMPLEMENTATION) due 9/25/2026
  - TCC (Transformative Climate Communities Round 6 PLANNING) due 9/30/2026
  - NCPN (Plant Protection Act Section 7721) due 10/19/2026
  - Active Potential Partners list contains 59 organizations across multiple California counties
  - Partner list includes California State University East Bay, Resilient Bayview, The Provenance Solution, City of San José
    Energy Department, and others
  - Archive of EHCRP interested orgs preserved with 62 rows of historical outreach data
  flags:
  - Contact data present (redacted in excerpts per protocol); full file contains [email] and [phone] fields
  - Excerpt too thin to judge completeness of opportunity descriptions or partner profiles — only table structure and sample
    rows visible, not full content
  - Internal working document with active coordination notes; treat as operational reference not public-facing asset
  - ARPAH opportunity marked 'Missed' — status outdated or superseded
