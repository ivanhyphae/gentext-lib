asset_id: ehcrp-r2-ta-guide-belonging
card:
  summary: 'EHCRP Round 2 technical assistance guide explaining the Belonging program value: how to design infrastructure
    with community input so it feels safe, welcoming, and reflective of users. Covers inclusivity, accessibility, and engagement
    strategies with links to external resources and project examples.'
  doc_role: guidance
  authorship: LCI (Extreme Heat and Community Resilience Program)
  disposition: reference
  disposition_reason: Authoritative TA guidance defining Belonging expectations and evaluation criteria for EHCRP Round 2
    applications. Not proposal prose to reuse, but essential reference for understanding what strong answers to be-q1 and
    be-q2 must demonstrate.
  serves_needs:
  - need_id: be-q1
    how: Defines Belonging and design elements (inclusive process, accessibility, community representation, sense of place,
      safety); guides what applicants must show
  - need_id: be-q2
    how: Explains engagement strategies (community-centered design, barrier removal, marginalized voice power) and lists external
      resources on equitable participation
  sections:
  - sid: s3
    path: 'What You Need To Know: > Understanding Belonging as a Program Value'
    type: need-statement
    reuse_value: high
    note: 'Core definition of Belonging as program value: design with and for community so infrastructure feels safe, welcoming,
      reflective; long-term stewardship through genuine engagement'
  - sid: s4
    path: 'What You Need To Know: > Elements of Belonging'
    type: method
    reuse_value: high
    note: 'Detailed framework: Inclusivity (data use, heat-vulnerable community ID, power in decision-making); Accessibility
      (marginalized voice amplification, functional/access-centered design, local org partnerships)'
  fact_candidates:
  - 's2: Round 2 funds Early and Advanced Infrastructure projects to mitigate extreme heat impacts'
  - 's3: Belonging ensures community feels infrastructure belongs to them and will use/care for it long-term'
  - 's3: Strong applications describe steps to design infrastructure in response to community-expressed needs and desires'
  - 's4: Inclusivity requires identifying heat vulnerable communities using data and working with community leaders'
  - 's4: Accessibility means marginalized voices have more say in decision-making, sometimes requiring extra outreach'
