asset_id: ehcrp-r2-partnerships-guide
card:
  summary: LCI EHCRP Round 2 technical assistance guide covering partnership eligibility, required roles (Lead Applicant,
    Co-Applicant, Contributor, Supporter), documentation requirements, and preparation steps. Includes partnership types,
    pairing rules by entity type, and organizational capacity self-assessment prompts for grant management.
  doc_role: guidance
  authorship: California State (LCI / Governor's Office of Land Use and Climate Innovation)
  disposition: reference
  disposition_reason: Authoritative eligibility and procedural guidance for EHCRP Round 2; not prose to reuse, but essential
    lookup document for understanding application structure, partner roles, and required documentation. Will be consulted
    repeatedly during pre-application and full application preparation.
  serves_needs:
  - need_id: pt-q1
    how: Defines required Lead Applicant and Co-Applicant pairings and eligibility criteria; guides identification of partnership
      expertise and balance.
  - need_id: pt-q2
    how: Requires documentation of prior organizational capacity, financial management, and operational experience; informs
      assessment of partner track record.
  sections:
  - sid: s4
    path: Integrated Climate Adaptation and Resilience Program > Applicant Team Roles
    type: solicitation-text
    reuse_value: high
    note: Defines Lead Applicant, Co-Applicant, Contributor, Supporter roles and responsibilities; directly applicable to
      partnership structuring.
  - sid: s5
    path: Integrated Climate Adaptation and Resilience Program > Round 2 Partnership Requirements
    type: solicitation-text
    reuse_value: high
    note: States mandatory Lead + Co-Applicant requirement, pairing rules, and post-award Partnership Agreement template process.
  - sid: s8
    path: Integrated Climate Adaptation and Resilience Program > Lead Applicant and Co-Applicant Types
    type: solicitation-text
    reuse_value: high
    note: 'Required pairing matrix: Local/Regional Public Entity with CBO; CBO with Local/Regional Public Entity + CBO; Academic
      with CBO or Local/Regional; Tribes exempt.'
  - sid: s18
    path: Project Roles > Co-Applicant Requirements
    type: solicitation-text
    reuse_value: medium
    note: 'Specifies Co-Applicant deliverables: work plan/budget detail, financial capacity documents (2 years statements,
      990s, audit findings), Letter of Support content.'
  - sid: s26
    path: Project Roles > How to Prepare for Round 2
    type: solicitation-text
    reuse_value: medium
    note: 'Timeline guidance: R2 launch expected early 2026; urges early partner identification and role clarification.'
  - sid: s27
    path: Project Roles > Identifying Potential Partnerships
    type: solicitation-text
    reuse_value: medium
    note: Lists partnership archetypes (climate collaboratives, social services, youth, Access & Functional Needs orgs) and
      discovery prompts for trustworthy community partners.
  - sid: s28
    path: Project Roles > Partnership Building Checklist
    type: template
    reuse_value: medium
    note: Step-by-step checklist for partner identification, role assignment, documentation gathering, and Letter of Support
      timing.
  - sid: s33
    path: Project Roles > Financial & Grant Management Capacity
    type: template
    reuse_value: medium
    note: Nine self-assessment prompts for Lead Applicant financial and grant management readiness (policies, accounting,
      compliance, reporting).
  - sid: s34
    path: Project Roles > Operational Capacity
    type: template
    reuse_value: medium
    note: Eight self-assessment prompts for staffing, structure, data systems, partner management, leadership engagement,
      and program implementation scale.
  fact_candidates:
  - Round 2 Application expected to launch in early 2026.
  - Co-Applicants required for all projects except California Native American Tribes and Tribal Entities.
  - If awarded, Lead Applicant enters grant agreement with State; Co-Applicants receive funds through Lead Applicant subgrant.
  - Co-Applicant work plan and budget must include key activities, detailed tasks, and allocated budget.
  - Contributors limited to no more than 30% of project budget.
  - 'Financial capacity documents required: balance sheets, income statements, cash flow statements from last two years.'
  - Non-profits must provide Form 990 (most recent) and IRS 501(c)(3) Tax Determination Letter.
  - Lead Applicant is sole point of contact with Governor's Office of Land Use and Climate Innovation (LCI).
  - Partnership Agreement template provided post-award.
  - Lead Applicant required to submit Pre-Application Interest Form.
  flags:
  - Excerpt thin for some sections (s9–s17 appear to be table headers with minimal content)
  - No webinar dates, Q&A, or workshop materials visible (asset ehcrp-r2-webinars-office-hours not found here)
  - Guidance predated 2025-11-06; may reference early 2026 launch as estimate only—verify against current LCI announcements
