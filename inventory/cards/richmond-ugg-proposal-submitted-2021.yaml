      Louisville, Green for Good) demonstrating landscape design and community-based greening capacity.
  - need_id: lib-methods
    how: i-Tree GHG quantification methodology for tree-planting; community engagement approach (Green Team youth program,
      Green Corps workforce); participatory design rooted in 2019 resident dialogues.
  - need_id: lib-partners
