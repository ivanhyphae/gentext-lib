card:
  summary: 'Submitted CNRA Urban Greening Grant proposal (2021) for Richmond Parkway Treefence project—three pilot sites with
    tree planting, safe streets, and youth employment in a disadvantaged, under-treed corridor near schools and transit. Lead:
    Groundwork Richmond; subcontractor: Hyphae Design Lab. $900K requested + $750K match = $1.65M total. GHG sequestration
    via i-Tree modeling (532 trees, 804.7 metric tons CO₂ over 40 years). Community-driven design rooted in 2019 resident
    dialogues identifying air pollution and canopy gaps as top priorities.'
  doc_role: submitted-proposal
  authorship: Groundwork Richmond (lead); Hyphae Design Lab (subcontractor)
  disposition: hold
  disposition_reason: Closest prior-round precedent for Bay Point UGG concept (same funder, program, structure). Contains
    reusable prose on community engagement, GHG quantification method, and environmental-justice framing; submitted proposal
    with named outcomes and proven partnership model.
