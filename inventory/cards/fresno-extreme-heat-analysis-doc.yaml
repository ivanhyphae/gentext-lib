asset_id: fresno-extreme-heat-analysis-doc
card:
  summary: This is a 63,841-word submitted proposal for the Fresno County Extreme Heat Analysis Planning Grant from Fresno
    COG. The proposal is a collaborative effort led by Hyphae Design Lab with partners Urban Diversity Design, Binational
    of California, and Tree Fresno. It outlines a comprehensive nine-task plan to assess extreme heat vulnerability across
    Fresno County, engage communities, develop tree-canopy and shade projects, and deliver a prioritized implementation plan
    with five detailed project profiles in the most vulnerable areas. The document includes technical approaches using high-resolution
    UTCI modeling, community engagement strategies, and cost estimates for shade interventions. The proposal demonstrates
    Hyphae's capability in data-driven climate adaptation work integrated with robust community partnerships.
  doc_role: submitted-proposal
  authorship: Hyphae Design Lab (lead); Urban Diversity Design (UDD/Sheila Hakimipour); Binational of California (BOCC/Ricardo
    Castorena, Rico Peralta); Tree Fresno (Mona Cummings)
  disposition: hold
  disposition_reason: Submitted proposal with detailed methodology, partner roles, and community engagement strategies directly
    applicable to EHCRP and future extreme heat projects. Contains reusable prose on heat vulnerability assessment, high-resolution
    modeling, community engagement frameworks, and tree-canopy project development. Demonstrates Hyphae's firm experience
    and technical capabilities in heat-resilience planning.
  serves_needs:
  - need_id: lib-firm-experience
    how: Prescott Greening Project case study (2021–2024, AB 617 & TCC funding, $1.15M total) with outcomes in air quality,
      vegetation, phased implementation
  - need_id: lib-methods
    how: Detailed 1–10m resolution UTCI/thermal comfort modeling using LIDAR, LCZ classification, synthetic population mapping;
      pedestrian/bike traffic analysis; community engagement via 20 popup listening sessions & working group formation
  - need_id: lib-partners
    how: 'Partner profiles: Tree Fresno (30+ yrs urban forestry, $1M Valley Air District award 2023), BOCC (decade Central
      Valley reach, Toys for Tots 4k/yr, embedded outreach model), UDD (Complete Streets, Vision Zero, hazard risk studies)'
  - need_id: lib-site-bay-point
    how: Limited direct Bay Point data; however, modeling methodology and vulnerability assessment framework (census disaggregation,
      sensitive receptor mapping, worker exposure) transferable to Bay Point context
  sections:
  - path: C. OVERVIEW
    type: need-statement
    reuse_value: high
    note: Fresno County 64 days >100°F in 2024, Oct 3 peak 105°F (highest October on record); 5.3–8.7°F warming projected
      by end century; 66 extreme heat days/yr under high emissions; 55% of census tracts >75th percentile CalEnviroScreen
      4.0
  - path: 'D. Detailed Work Plan > Task 1: Collaboration and Community Engagement > Approach > Formation of the Extreme Heat
      Working Group'
    type: method
    reuse_value: high
    note: 3-month stakeholder recruitment via partner networks, ensuring disadvantaged community representation; includes
      city/county/health/transit/CBO membership; culturally effective engagement model
  - path: 'D. Detailed Work Plan > Task 1: Collaboration and Community Engagement > Approach > Community Engagement Events
      Execution'
    type: method
    reuse_value: high
    note: 20 popup listening sessions in named rural/farmworker communities (Reedley, Parlier, etc.); CERT ambassador recruitment;
      20 BOCC-featured events; multilingual materials; Toys for Tots/health fair integration
  - path: 'D. Detailed Work Plan > Task 3: Extreme Heat Vulnerability Analysis > Approach > Methodology for Extreme Heat Vulnerability
      Analysis > Hyper-local high resolution environmental modeling.'
    type: method
    reuse_value: high
    note: 1–10m meter-scale UTCI & shade modeling; 3D digital twins from USGS LIDAR (2019–2023); novel proprietary pipeline
      for air temp, humidity, radiant temperature; allows detection of 20–30°F variation within 20–30 ft blocks
  - path: 'D. Detailed Work Plan > Task 3: Extreme Heat Vulnerability Analysis > Approach > Social and infrastructural vulnerability
      > Census Disaggregation'
    type: method
    reuse_value: medium
    note: Disaggregates census data with PopGrid (building-level population via Microsoft layers) and RTI synthetic populations
      (demographic precision); avoids generic census-tract analysis
  - path: 'D. Detailed Work Plan > Task 4: Conduct Pedestrian and Bicyclist Traffic Analysis and Location Analysis > Approach
      to Pedestrian and Bike Analysis > Data for Analysis'
    type: method
    reuse_value: medium
    note: Pedestrian/bike volume data collection via counters, mobile app surveys, intercept surveys; integrates with heat
      vulnerability hotspots; informs active transportation planning under heat stress
  - path: 'D. Detailed Work Plan > Task 5: Develop a Draft List of Tree Canopy and Vegetative Cover Projects > Approach'
    type: method
    reuse_value: medium
    note: Tree Fresno leads native/drought-tolerant species selection for vulnerable corridors; leverages 30+ yrs local forestry
      expertise and established community relationships
  - path: E. Management Approach > Overview of Management Approach > Partnership Structure > Binational of California
    type: partner-role
    reuse_value: high
    note: 'BOCC: 10+ yrs experience Fresno/Kern/Tulare, targets Latinos/Indigenous farmworkers/non-English speakers; primary
      community liaison; trusted messenger model; embeds outreach in high-attendance cultural events (Toys for Tots, tax prep,
      health fairs)'
  - path: E. Management Approach > Overview of Management Approach > Partnership Structure > Tree Fresno
    type: partner-role
    reuse_value: high
    note: Mona Cummings CEO; 30+ yrs urban forestry; regional leader in climate-resilient greening; $1M Valley Air District
      award Spring 2023; large-scale tree planting & partnership track record
  - path: E. Management Approach > Overview of Management Approach > Partnership Structure > Urban Diversity Design
    type: partner-role
    reuse_value: medium
    note: 'Sheila Hakimipour: Complete Streets, Corridor Revitalization, engagement plans; currently on Fresno COG hazard
      risk study (ARUP), Vision Zero launch; synthesizes plans/policies/guidelines for heat adaptation'
  - path: J. Summary of Qualifications > Firm Experience > Hyphae Design Lab has extensive experience delivering innovative,
      data-driven solutions that address urban resilience, environmental justice, and pollution mitigation. By integrating
      technical rigor with robust community engagement, Hyphae empowers communities with actionable data and scalable design
      strategies tailored to their specific needs.
    type: project-case
    reuse_value: high
    note: 'Prescott Greening (2021–2024, $1.15M total: $150k TCC, $300k MTC PCA, $600k ACTC, $50k Port Oakland, $100k CalFire);
      West Oakland CAP (AB 617); integrates air monitoring, vegetated buffers, tree planting; phased implementation model'
  fact_candidates:
  - 'C. OVERVIEW: Fresno County recorded 64 days exceeding 100°F in 2024'
  - 'C. OVERVIEW: October 3, 2024 Fresno recorded 105°F (highest October temperature in Fresno''s history)'
  - 'C. OVERVIEW: Annual average max temps projected to rise 5.3–8.7°F by end of century'
  - 'C. OVERVIEW: Extreme heat days (>94.3°F) expected to increase from 5/yr historical average to 66/yr under high emissions'
  - 'C. OVERVIEW: Over 55% of Fresno County census tracts rank above 75th percentile on CalEnviroScreen 4.0'
  - 'D. Task 1: 20 popup listening sessions planned across named rural/farmworker communities'
  - 'D. Task 1: 20 BOCC-featured events throughout grant period'
  - 'D. Task 3: High-resolution UTCI modeling at 1–10 meter resolution from USGS LIDAR 2019–2023'
  - 'E. Partnership Structure > Tree Fresno: $1 million awarded by Valley Air District Spring 2023'
  - 'E. Partnership Structure > BOCC: Toys for Tots serves 4,000 people annually'
  - 'J. Firm Experience: Prescott Greening $1.15M total funding (2021–2024)'
  - 'J. Firm Experience: Prescott received $150k Transformative Climate Communities grant, $300k MTC PCA, $600k ACTC match'
  flags:
  - working-doc with heavy strikethrough sections and edit notes; 'scraps' and coordination sections contain candid planning
    notes and budget concerns
  - internal contact data redacted but email addresses still visible in some meeting notes sections
  - 'near-duplicate phrasing across multiple ''blurb'' sections (Blurb #1, #2, #3, #4 on BOCC role)'
  - document organized as Google Doc with inline comments and revision history; includes unvetted partner meeting notes and
    strategy discussions not final
  - '''Stuff from other projects'' section contains references to Dallas, Boyle Heights, Ambrose Park projects with incomplete
    excerpts and links to external docs—context leakage risk if reused'
  - excerpt evidence on methods is strong (UTCI modeling, engagement strategies, partner roles) but Fresno-specific data (heat
    days, temps, CalEnviroScreen) should be verified against latest official sources
  - proposal submitted but still contains multiple '[moveable]' and draft task descriptions suggesting final version may differ
    from this working doc
