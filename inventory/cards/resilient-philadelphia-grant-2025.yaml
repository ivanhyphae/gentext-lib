asset_id: resilient-philadelphia-grant-2025
card:
  summary: Draft proposal for Philadelphia's Resilient Philadelphia Citywide Resilience Plan Update (RFP deadline 4/27/2025,
    $250k, 24 months). Hyphae partnering with Clean Air Council on community engagement and climate resilience planning. Document
    is a working compilation mixing proposal drafts, meeting notes, budget justification, and reused material from prior projects
    (Arlington Park/Dallas SWMD, Boyle Heights EPA grant, Harry Hines evidence-based design methodology). Includes narrative
    on community co-design, evidence-based design approach, sensor deployment, tree planting strategies, complete streets
    analysis, and monitoring methodology. Supporting materials reference prior Hyphae projects in Dallas, Los Angeles, Richmond,
    Stockton, and Oakland.
  doc_role: proposal-draft
  authorship: Hyphae Design Lab (with Clean Air Council partner); primary authors appear to be Brent Bucknum, Ivan Heitmann,
    Merissa MacDonald, Daniel Fleischer, Maxwell Pingeon
  disposition: ignore
  disposition_reason: This is a working draft of a Philadelphia-specific proposal (not a submitted application or completed
    project). While it contains reusable prose on Hyphae's evidence-based design methodology, sensor deployment, and engagement
    approaches, the document is heavily scaffolded from recycled material (72% near-duplicate with NSF S&CC TAMU, Arlington
    Park, and CalEPA proposals per metadata). The Philadelphia application is not relevant to active Hyphae needs (LCI EHCRP
    Round 2 Bay Point applications). Extract specific methodology language into lib-methods instead of holding the whole draft.
  serves_needs: []
  sections:
  - sid: s30
    path: Narrative project description > Community Co-Design Approach
    type: method
    reuse_value: medium
    note: Overview of Hyphae's EJ approach integrating data, science, and community empowerment; reusable framing for harm-reduction
      and belonging questions
  - sid: s31
    path: Narrative project description > Evidence-Based Design Approach
    type: method
    reuse_value: medium
    note: 'Comprehensive description of EBD process: understanding problem via research/monitoring/modeling, engaging community,
      iterative design; applicable to EHCRP methodology'
  - sid: s66
    path: BH-EPA-Grant EDITED > Approach > Evidence-based Design
    type: method
    reuse_value: medium
    note: Hyperlocal mapping, measurement tools (NSF/NIH funding mentioned), adaptOS platform for simulation/design/implementation;
      five-stage process (measurement, simulation, implementation, assessment, refinement)
  - sid: s68
    path: 'BH-EPA-Grant EDITED > Approach > The Approach: Measurement & Modeling'
    type: method
    reuse_value: medium
    note: Adaptive measurement, design, modeling workflow; data collection (heat, air quality, greenness, demographics); LIDAR
      and Street View 360 for digital twin; pre/during/after physical surveys
  - sid: s81
    path: Green Spine Design Coordination Hyphae Scope and Schedule > Introduction
    type: project-case
    reuse_value: medium
    note: Texas Trees Foundation Green Spine corridor intervention in SWMD Dallas; evidence-based design, health endpoints,
      thermal comfort as primary measure; living laboratory framework
  - sid: s94
    path: Harry Hines Evidence-based design methodology report > Executive summary > Introduction
    type: method
    reuse_value: high
    note: Complete evidence-based design methodology framework; use of literature, environmental simulations, monitoring;
      platform for generalizing learnings across communities
  - sid: s96
    path: Harry Hines Evidence-based design methodology report > Monitoring and pre-post study
    type: method
    reuse_value: high
    note: 'Specific findings: peak mean radiant temperature reductions of 24°C under large mature trees vs. sun; avg summer
      afternoon 8°C cooler in tree shade; small trees 3.5°C cooler; methodology for pre-post thermal comfort evaluation'
  - sid: s100
    path: Harry Hines Evidence-based design methodology report > Brief Literature review > Vegetated Air Barriers for Roadside
      Pollution Mitigation
    type: method
    reuse_value: medium
    note: 'Design rubrics for roadside vegetated barriers: high surface area vegetation, no gaps, species guidance (Thuja,
      Abies, Pinus, Taxus, Juniperus, grasses/shrubs); referenced design standards'
  - sid: s105
    path: Harry Hines Evidence-based design methodology report > Monitoring > Sensor Hardware
    type: method
    reuse_value: medium
    note: LORAWAN network architecture for sensor deployment; hub on Parkland Hospital rooftop; Dragino LSN50-V2 modules;
      cloud infrastructure (MQTT protocol); temperature and wind sensor types
  - sid: s106
    path: Harry Hines Evidence-based design methodology report > Monitoring > Sensor Placement
    type: method
    reuse_value: medium
    note: 'Sensor placement strategy: 23 sun-exposed, 15 in large tree shade, 7 in small tree shade; captures thermal benefit
      variation; supports cost-benefit assessment of tree sizing'
