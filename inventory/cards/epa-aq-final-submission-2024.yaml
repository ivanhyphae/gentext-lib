    type: project-case
    reuse_value: high
    note: 'West Oakland prior work: Hyphae methods combined outreach with CFD/modeling; empirical foundation for CBO advocacy;
      led to 2019 WOCAP regulatory concessions from CalTrans, DOT, Port of Oakland, refineries'
  - sid: s19
    path: part 19
    type: project-case
    reuse_value: high
    note: 'West Oakland Community Air Action Plan (WOCAP) 2019 outcomes: CalTrans, DOT, Port of Oakland, refineries forced
      to make substantial regulatory concessions on pollution risk mitigation'
