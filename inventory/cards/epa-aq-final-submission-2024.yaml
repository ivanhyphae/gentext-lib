asset_id: epa-aq-final-submission-2024
card:
  summary: Submitted 2024 EPA air-quality grant (EPA-G2024-STAR-D1 AirSense) led by University of South Florida (Tejada-Martinez,
    PI) with Hyphae as contracted partner. Proposes 4-year project (2025–2029) to enhance urban air quality monitoring, modeling,
    and management by integrating low-cost sensor networks with regulatory data, CFD simulations, machine learning, and community
    engagement across three California CBOs (Climate Resolve, Little Manila Rising, Environmental Indicators Project). Combines
    Kalman filtering, artificial neural networks, and OpenFOAM CFD at meter-scale resolution to identify pollution hotspots
    and support policy advocacy in environmental justice communities.
  doc_role: submitted-proposal
  authorship: Andres E. Tejada-Martinez (PI, USF), Amy Stuart (Co-PI, USF); Hyphae Design Lab (contracted partner); three
    community-based organizations (Climate Resolve, Little Manila Rising, Environmental Indicators Project)
  disposition: hold
  disposition_reason: Submitted federal proposal with strong reusable capability text on air quality monitoring methods (sensor
    integration, CFD modeling, machine learning, Kalman filtering), community engagement strategy, and documented outcomes
    from prior West Oakland air quality work (WOCAP 2019). Methods and partnership approach directly applicable to future
    proposals.
  serves_needs:
  - need_id: lib-methods
    how: Detailed description of sensor data integration, Kalman filtering, CFD modeling with OpenFOAM, artificial neural
      networks, and community-led air quality assessment methods across 4-year timeline
  - need_id: lib-partners
    how: 'Named partner track records: Climate Resolve, Little Manila Rising, Environmental Indicators Project; documented
      prior success with West Oakland coalition forcing 2019 WOCAP regulatory concessions from CalTrans, DOT, Port of Oakland'
  sections:
  - sid: s2
    path: part 2
    type: need-statement
    reuse_value: high
    note: Environmental justice framing for air quality disparities; cites health impacts and regulatory gaps; establishes
      case for integrated monitoring and CFD modeling
  - sid: s3
    path: part 3
    type: capability
    reuse_value: high
    note: 'Expected outcomes: enhanced data integration, accurate pollution models, improved monitoring spatial/temporal resolution,
      effective intervention identification'
  - sid: s4
    path: part 4
    type: method
    reuse_value: high
    note: Validation approach for CFD models using low-cost sensor networks; Kalman filtering technique; addressing data quality
      challenges in underserved communities
  - sid: s5
    path: part 5
    type: network
    reuse_value: medium
    note: Hyphae's established relationships with CBOs and sensor network operators in Oakland, Los Angeles, Stockton; access
      to multi-year air quality data across California
  - sid: s6
    path: part 6
    type: method
    reuse_value: high
    note: Data processing via Kalman filtering and artificial neural networks (ANN) for unified state estimation; ANN models
      for rapid air quality prediction at neighborhood scale
  - sid: s9
    path: part 9
    type: method
    reuse_value: high
    note: Micro-scale CFD simulations at meter to sub-meter scale; urban heat island, wind patterns, pollutant dispersion;
      role of trees in pollution reduction
  - sid: s10
    path: part 10
    type: method
    reuse_value: high
    note: OpenFOAM setup; finite volume method; vehicle-induced turbulence (VIT) modeling; emission rate calculations; roadway
      source zones
  - sid: s12
