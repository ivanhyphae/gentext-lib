asset_id: community-air-monitoring-proposal-2026
card:
  summary: Meeting notes from 2026-04-10 on a community-driven air quality monitoring proposal combining narrative scope (Charles)
    with a rapid-response technical system (Brent). The team proposes expanding PM2.5 sensor deployment across Richmond, Benicia,
    Martinez, and Pittsburgh; adding speciated pollutants (formaldehyde, VOCs) from renewable diesel facilities; and deploying
    a three-tier sampling approach (low-cost sensors, research-grade instruments, lab analysis). Discussion covered grant
    strategy (separate per-jurisdiction applications with coalition letters), partnerships (academic advisors, Air District
    technical assistance, community engagement), biomonitoring feasibility, budgeting ($500K–$5M range), and next steps (outreach
    summary, weekly meetings, partner recruitment).
  doc_role: working-doc
  authorship: Hyphae team (Juan Penaloza Gutierrez, Brent Bucknum, Charles Davidson, Annie Beaman, Ivan Heitmann) + external
    advisors
  disposition: hold
  disposition_reason: Early-stage proposal planning for air-quality monitoring grant with detailed technical scope, method
    design, and partnership strategy; contains reusable capability and method elements for community-science monitoring and
    rapid-response deployment frameworks; planning insights applicable to future environmental justice proposals.
  serves_needs: []
