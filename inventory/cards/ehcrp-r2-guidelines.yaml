asset_id: ehcrp-r2-guidelines
card:
  summary: 'EHCRP Round 2 Final Guidelines (June 2026) — the authoritative solicitation for the Extreme Heat and Community
    Resilience Program''s second funding round. Defines two project types (Early Infrastructure: $750k–$1.2M planning + demo
    over 30 months; Advanced Infrastructure: $3–$4.5M implementation over 48 months), eligibility, workplan structure, scoring
    rubric (100 points total: 55 narrative, 15 funding priorities, 20 workplan/budget, 10 interview), and four core values
    (Harm Reduction, Partnership, Belonging, Lasting Community Benefits). Application due 2026-10-13. Includes appendices
    on Native American Tribes, Belonging design principles, eligible project types, workplan examples, funding priority assessment,
    and glossary.'
  doc_role: solicitation
  authorship: LCI (Governor's Office of Land Use and Climate Innovation)
  disposition: reference
  disposition_reason: Authoritative solicitation document; essential for understanding application requirements, scoring criteria,
    and eligible activities. Not prose to reuse into proposals, but required reference for all applicant questions and compliance.
  serves_needs:
  - need_id: overview
    how: Section 3 (Early Infrastructure) and Section 4 (Advanced Infrastructure) define both project types, deliverables
      (planning document + demo; completed infrastructure + playbook), contract periods (30 vs. 48 months), and award ranges.
  - need_id: hr-q1
    how: Section 7 and Appendix F define Harm Reduction scoring criteria requiring specific community, exposure pathways,
      harms, data + lived experience, and community voices.
  - need_id: hr-q2
    how: Appendix F, Harm Reduction Question 2 scoring criteria require pathway from infrastructure to harm, rationale, measurable
      outcomes, and tracking methodology.
  - need_id: pt-q1
    how: Appendix F, Partnership Question 1 scoring criteria require naming lead and co-applicants, unique expertise of each,
      why single org could not succeed, and balance of community knowledge and institutional capacity.
  - need_id: pt-q2
    how: Appendix F, Partnership Question 2 scoring criteria require concrete prior projects per partner, collaboration milestones
      or lessons, and proven capacity.
  - need_id: be-q1
    how: Appendix F, Belonging Question 1 scoring criteria require specific design elements (murals, color palettes, cultural
      programming, plant species, architecture) rooted in community identity.
  - need_id: be-q2
    how: Appendix F, Belonging Question 2 scoring criteria require engagement strategies (participatory design, workshops,
      trauma-informed), barrier removal, and how input shapes decisions.
  - need_id: lcb-q1
    how: Appendix F, Lasting Community Benefits Question 1 scoring criteria require planning/playbook to drive future infrastructure,
      build local support, and name funding streams or revenue sources.
  sections:
  - sid: s4
    path: Guideline Overview
    type: solicitation-text
    reuse_value: high
    note: Defines program purpose, two project types (Early $750k–$1.2M; Advanced $3–$4.5M), and funding sources (2024 Climate
      Bond, GGR Fund).
  - sid: s6
    path: 1. Background
    type: solicitation-text
    reuse_value: medium
    note: Context on Round 1 outcomes ($32M to 47 grantees across 23 counties) and Round 2 design informed by 500+ community
      input sessions in 2025.
  - sid: s7
    path: 2. Program Values
    type: solicitation-text
    reuse_value: high
    note: Defines four core values (Harm Reduction, Partnership, Belonging, Lasting Community Benefits) that shape all scoring
      and project design.
  - sid: s8
    path: 3. Early Infrastructure Projects
    type: solicitation-text
    reuse_value: high
    note: Specifies Early Infrastructure deliverables (planning document + demonstration project), award range ($750k–$1.2M),
      30-month contract period, and eligible project types.
  - sid: s9
    path: 4. Advanced Infrastructure Projects
    type: solicitation-text
    reuse_value: high
    note: Specifies Advanced Infrastructure deliverables (completed infrastructure + Future Implementation Playbook), award
      range ($3–$4.5M), 48-month contract period.
  - sid: s11
    path: 5. Workplan and Eligible Activities
    type: solicitation-text
    reuse_value: high
    note: Six-task workplan structure (Project Initiation, Community Assessment & Engagement, Infrastructure Readiness, Infrastructure
      Deployment, Planning & Policy, Monitoring & Evaluation) with eligible activities for each.
  - sid: s12
    path: 5. Workplan and Eligible Activities > Task 2. Community Assessment and Engagement
    type: solicitation-text
    reuse_value: high
    note: Defines scope of community engagement and vulnerability assessment activities for Early vs. Advanced projects.
  - sid: s13
    path: 5. Workplan and Eligible Activities > Task 3. Infrastructure Readiness
    type: solicitation-text
    reuse_value: high
    note: Pre-construction activities, including design, permitting, site control, and Readiness Review approval process.
  - sid: s16
    path: 6. Eligibility
    type: solicitation-text
    reuse_value: high
    note: Eligible lead applicant types (local/regional public entities, nonprofits, tribes, higher ed, coalitions) and co-applicant
      requirements.
  - sid: s19
    path: 7. Funding Priorities
    type: solicitation-text
    reuse_value: high
    note: '2024 Climate Bond requirement: min. 40% funding to DACs/Vulnerable Populations; min. 10% to SDACs. Defines California
      Native American Tribes (15 pts), SDACs (15 pts), Vulnerable Populations (12 pts), DACs (10 pts).'
  - sid: s24
    path: 7. Funding Priorities > 7.3 Funding Priorities Groups Definitions
    type: solicitation-text
    reuse_value: high
    note: Precise definitions of four funding priority groups and point allocations; references 2024 Climate Bond DAC Map
      and VCP.
  - sid: s26
    path: 8. Application Process
    type: solicitation-text
    reuse_value: medium
    note: Pre-application and full application submission windows via Submittable; pre-application feedback provided to inform
      full application.
  - sid: s28
    path: 9. Post-Award Requirements > 9.2 Readiness Review Requirements
    type: solicitation-text
    reuse_value: high
    note: Grantee must demonstrate CEQA compliance, site control, and other pre-implementation requirements within 12 months
      before construction costs incurred.
  - sid: s31
    path: '11. Appendix > Appendix B: Belonging Guide'
    type: solicitation-text
    reuse_value: high
    note: Rationale and guidance for Belonging as core value; emphasizes community welcome, safety, historical trust-building,
      and infrastructure utilization.
  - sid: s32
    path: '11. Appendix > Appendix C: Eligible Projects Examples'
    type: solicitation-text
    reuse_value: high
    note: 'Built environment solutions: cool pavements, cool corridors, passive/active cooling at transit & housing. Reference
      examples for infrastructure typology.'
  - sid: s33
    path: 11. Appendix > Nature-Based Solutions
    type: solicitation-text
    reuse_value: high
    note: Urban forestry, tree planting, cool corridors, green stormwater, water-based cooling, green/blue space restoration.
      Eligible nature-based infrastructure types.
  - sid: s40
    path: '11. Appendix > Appendix F: Scoring Criteria'
    type: solicitation-text
    reuse_value: high
    note: 'Scoring overview: 55 narrative (7+12+12+12+12 for Project Overview, Harm Reduction, Partnership, Belonging, Lasting
      Community Benefits), 15 funding priorities, 20 workplan/budget, 10 interview; 100 total.'
  - sid: s42
    path: '2. Narrative Section (55 Points): > 2.1 Narrative Section: Project Overview (7 Points)'
    type: solicitation-text
    reuse_value: high
    note: 'Project Overview scoring criteria: 300-word limit; must name infrastructure type, deliverables, key tasks, sequence,
      and contract period compliance.'
  - sid: s43
    path: '2. Narrative Section (55 Points): > 2.2 Narrative Section: Harm Reduction (12 Points)'
    type: solicitation-text
    reuse_value: high
    note: 'Harm Reduction Q1 & Q2 scoring rubrics (6 pts each, 250-word limits): requires community identification, exposure
      pathways, harms, data + lived experience, community voices, infrastructure-to-harm pathway, rationale, and measurable
      metrics.'
  - sid: s44
    path: '2. Narrative Section (55 Points): > 2.3 Narrative Section: Partnership (12 Points)'
    type: solicitation-text
    reuse_value: high
    note: 'Partnership Q1 & Q2 scoring rubrics (6 pts each, 250-word limits): requires lead & co-applicants named, unique
      expertise, necessity of partnership, balance of community knowledge and institutional capacity, prior projects, collaboration
      lessons.'
  - sid: s45
    path: '2. Narrative Section (55 Points): > 2.4 Narrative Section: Belonging (12 Points)'
    type: solicitation-text
    reuse_value: high
    note: 'Belonging Q1 & Q2 scoring rubrics (6 pts each, 250-word limits): requires design elements (murals, palettes, programming,
      plants, architecture) rooted in community identity, engagement strategies, barrier removal, and how input shapes decisions.'
  - sid: s46
    path: '2. Narrative Section (55 Points): > 2.5 Narrative Section: Lasting Community Benefits (12 Points)'
    type: solicitation-text
    reuse_value: high
    note: 'Lasting Community Benefits Q1 scoring rubric (12 pts, 350-word limit): requires planning/playbook to support future
      infrastructure, build local support, name funding streams or revenue sources.'
  - sid: s51
    path: '3. Funding Priorities (15 Points): > 3.4 Vulnerable Population (12 points)'
    type: solicitation-text
    reuse_value: high
    note: 'Vulnerable Population definition: High Climate Hazard (Current) + High/Medium Social Vulnerability, or Medium Climate
      Hazard + High Social Vulnerability in VCP.'
