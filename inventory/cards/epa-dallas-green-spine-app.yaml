asset_id: epa-dallas-green-spine-app
card:
  summary: EPA ECJ Community Change Grant application (submitted Nov 2024) for the Green Spine for Dallas Health and Equity
    project, led by Texas Trees Foundation with Texas A&M University and City of Dallas. $19.3M grant to transform Harry Hines
    Boulevard and adjacent Arlington Park neighborhood in the Southwestern Medical District through tree planting, green infrastructure,
    pedestrian/bike improvements, and community engagement over 3 years (Jul 2025–Jun 2028). Targets 5 disadvantaged census
    tracts with high heat, air pollution, traffic burden, and linguistic isolation. Includes detailed governance structure,
    community engagement plan, cost breakdown, and compliance documentation.
  doc_role: submitted-proposal
  authorship: Texas Trees Foundation (lead); Texas A&M University (co-applicant); Arlington Park Neighborhood Association;
    City of Dallas
  disposition: hold
  disposition_reason: Submitted federal proposal with strong community engagement narrative, detailed site context for Dallas
    SWMD/Arlington Park, and replicable model for green infrastructure + heat reduction in disadvantaged urban area. Contains
    citable outcomes framework, partnership roles, and methodological approach (C-HEaRT climate health research, community
    ambassador model).
  serves_needs:
  - need_id: lib-site-bay-point
    how: Not Bay Point-specific, but provides detailed site characterization template for disadvantaged urban heat/pollution
      area (census tract profiling, CEJST/EJScreen mapping, community demographic snapshot). Reusable structure for Ambrose
      sites.
  - need_id: lib-partners
    how: Texas Trees Foundation organizational profile, fiscal history (25-year clean audits), Federal Single Audit status;
      Texas A&M C-HEaRT team expertise; partnership governance model with statutory vs. community partners.
  - need_id: lib-methods
    how: Community engagement strategy (listening sessions, co-design, Resident Researcher/Ambassador model, trauma-informed);
      engagement barriers (language, access); pre/post evaluation framework for heat, mobility, health outcomes.
  - need_id: lib-firm-experience
    how: Hyphae was co-author/partner on this application; demonstrates firm's ability to lead EPA ECJ grants, manage multi-institutional
      teams, and design participatory planning at scale ($19M).
  sections:
  - sid: s5
    path: s5 part 5 | Project narrative overview
    type: project-case
    reuse_value: high
    note: EPA funding amount, grant period, target census tracts, infrastructure strategies named (Green Spine arterial; green
      connector; Arlington Park tactical interventions).
  - sid: s6
    path: s6 part 6 | Site conditions—air quality, heat, tree canopy
    type: site-context
    reuse_value: high
    note: 'Specific data: 7% tree canopy vs. minimum standard; top 10%–20% nationally for PM, ozone, NO2, diesel PM, traffic
      proximity; Dallas metro 13th of 228 for high ozone days; 93 days >95°F in 2022, 55 in 2023.'
  - sid: s7
    path: s7 part 7 | CEJST census tract profiles
    type: site-context
    reuse_value: high
    note: Detailed table (Table 2) with tract IDs (48113010000a, 48113000401, 48113000406b), population, burden categories,
      percentile ranks (e.g., 94th low income, 90th lack green space), educational attainment.
  - sid: s10
    path: s10 part 10 | Community engagement—past outreach
    type: partner-role
    reuse_value: high
    note: TTF convening history, agreement with City for design engagement, Halloween event, spring 2024 collaborative event
      with Councilmember Moreno and City departments; community feedback on priorities.
  - sid: s11
    path: s11 part 11 | Community engagement—Arlington Park feedback
    type: need-statement
    reuse_value: high
    note: 'Direct quotes from residents: ''I love this! I wish there were more safe walking opportunities…'' and transit/shade
      concerns; 24 TAMU students participated; community-identified priorities beyond grant scope.'
  - sid: s12
    path: s12 part 12 | Collaborative governance structure
    type: partner-role
    reuse_value: medium
    note: Lead (TTF), Statutory Partner (TAMU C-HEaRT), Community Partner (Arlington Park Neighborhood Assoc), City liaison;
      monthly strategy sessions; grant management and reporting roles defined.
  - sid: s15
    path: s15 part 15 | Partner organizational profiles—TTF and TAMU
    type: org-profile
    reuse_value: medium
    note: 'TTF: urban forestry nonprofit; TAMU: land-grant institution (1876), sea-grant, space-grant; Dr. Gretchen Riley
      (TAMU Forest Service), Best Practices Advisory Committee; Dr. Chanam Lee (TAMU Landscape Architecture, DrAL Director,
      20+ years research/engagement).'
  - sid: s16
    path: s16 part 16 | Texas A&M University expertise
    type: org-profile
    reuse_value: medium
    note: 'Dr. Chanam Lee: Professor Landscape Architecture & Urban Planning, Executive Assoc. Dean, DrAL Founder/Director;
      interdisciplinary research and community engagement track record; complex project management.'
  - sid: s18
    path: s18 part 18 | Detailed project timeline and milestones
    type: method
    reuse_value: high
    note: Month-by-month activities from M1 (NEPA/design docs) through M36 (final construction/impact evaluation); co-design
      (M5–M12), pre-intervention assessment (M13–M15), construction (M13–M36), tactical interventions (M16–M24), impact evals
      (Year 3).
  - sid: s40
    path: s40 part 40 | Target community demographics—SWMD and Arlington Park
    type: site-context
    reuse_value: medium
    note: 'SWMD: 8 census tracts, 24,277 pop.; Arlington Park: 69% people of color, 30% Hispanic, 38% low-income, median HH
      income 44% below state average; linguistic isolation, poverty, education barriers named.'
  - sid: s42
    path: s42 part 42 | Community voices and student participation
    type: need-statement
    reuse_value: high
    note: Resident quote on safety/walking; transit/shade/connection quote; 24 TAMU students engaged in design process; evidence
      of community input shaping intervention design.
  fact_candidates:
  - 's5: EPA funding requested $19,333,316.91; award period Jul 1, 2025 – Jun 30, 2028'
  - 's5: 5 disadvantaged EPA IRA census tracts in direct impact zone: 48113000401, 48113000409, 48113000410, 48113000610,
    48113010001'
  - 's6: Dallas metro area 13th of 228 metro areas for high ozone days'
  - 's6: 2022: 93 days >95°F; 2023: 55 days >95°F'
  - 's6: Current Harry Hines Boulevard right-of-way has only 7% tree canopy cover'
  - 's6: Area ranks top 10%–20% nationally for PM, ozone, nitrogen dioxide, diesel PM, traffic proximity'
  - 's7: Census tract 48113010000a: 10,393 pop., 94th percentile low income, 96th percentile RMP proximity'
  - 's7: Census tract 48113000401: 5,584 pop., 90th percentile lack green space, 94th percentile linguistic isolation'
  - 's7: Arlington Park (CT 10001): 69% people of color, 30% Hispanic, 38% low-income'
  - 's40: Arlington Park median household income 44% below state average'
  - 's20: Total project budget (EPA + non-federal): $19,333,316.91 (direct $17,993,900.17 + indirect $1,339,416.74)'
  - 's15: TAMU opened as land-grant institution in 1876; later received sea-grant and space-grant designations'
  flags:
  - excerpt thin on past Hyphae firm outcomes/citable results; asset is TTF's application, not Hyphae library
  - sections s43–s46 appear blank or minimal (<300 words each); full attachment content not visible in preview
  - document is submitted/final version (Nov 21, 2024 preview date); minor risk of contact data redaction completeness in
    attachments not shown
  - strong site characterization and community voice material; limited pre-intervention outcome data shown (evaluation planned
    post-grant)
  - partnership model differs from Ambrose (Ambrose Recreation & Park District lead; this is TTF lead with TAMU co-applicant);
    governance structure template transferable but context-specific
