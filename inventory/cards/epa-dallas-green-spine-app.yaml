asset_id: epa-dallas-green-spine-app
card:
  summary: 'Submitted EPA ECJ Community Change Grant application from Texas Trees Foundation for the Dallas Green Spine project.
    Proposes $19.3M to transform Harry Hines Boulevard in the Southwestern Medical District (SWMD) and adjacent Arlington
    Park neighborhood through green infrastructure, heat mitigation, and community engagement. Partners include Texas A&M
    University (research/design) and Arlington Park Neighborhood Association. Project period July 2025–June 2028. Targets
    5 disadvantaged census tracts with 24,277 residents; 69% people of color, 30% Hispanic, 38% low-income in Arlington Park.
    Addresses extreme heat, air quality non-attainment (top 10–20% nationally for PM, ozone, NO₂), traffic proximity, and
    low canopy cover (7% vs. minimum standard). Includes tree planting, pedestrian/bike infrastructure, stormwater management,
    and community-led design co-development with Resident Researchers (Community Ambassadors). Deliverables: Green Spine construction,
    tactical park interventions, municipal infrastructure proposals, impact evaluations (physical activity, health, stress,
    mobility, heat exposure, flood resilience). Community engagement documented in spring 2024 listening sessions and co-design
    workshops.'
  doc_role: submitted-proposal
  authorship: Texas Trees Foundation (lead); Texas A&M University C-HEaRT team; Arlington Park Neighborhood Association; City
    of Dallas
  disposition: hold
  disposition_reason: Submitted federal grant with detailed community engagement narrative, site characterization, partnership
    structure, and outcomes framework. Contains reusable prose on heat equity, climate justice design, participatory methods,
    and community-embedded research. Site facts (demographics, environmental burdens, canopy cover) and harm-reduction pathway
    specifics (tree cooling, pedestrian safety, air quality, flood mitigation) are relevant to Bay Point EHCRP applications.
    Project case demonstrates successful multi-sector coordination and community-led co-design in a disadvantaged urban heat
    island.
  serves_needs:
