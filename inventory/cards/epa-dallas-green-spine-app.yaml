    how: Detailed community engagement, co-design, and participatory planning approach; pre/post monitoring framework for
      heat, mobility, health outcomes; integration of community voices in design process
  - need_id: lib-firm-experience
    how: Hyphae-led grant application (submitted) demonstrating capability in EPA ECJ grants, environmental justice, urban
      heat, green infrastructure, and community partnership management
