asset_id: ehcrp-r2-ta-guide-lasting-community-benefits
card:
  summary: LCI EHCRP Round 2 technical-assistance guide on Lasting Community Benefits as a program value. Explains the requirement
    for Early Infrastructure projects to produce a heat-related Planning Document; defines four types of lasting-benefit strategies
    (policy change, thoughtful planning, new programs, effective infrastructure); provides sample metrics across heat impact,
    belonging, implementation, and systemic change categories. 1,380 words across 14 sections.
  doc_role: guidance
  authorship: LCI (Extreme Heat and Community Resilience Program)
  disposition: reference
  disposition_reason: Authoritative TA guidance defining lcb-q1 requirements and evaluation framework. Not reusable as proposal
    prose, but essential to check against when drafting Lasting Community Benefits sections. Clarifies that a Planning Document
    is a central deliverable, not an afterthought, and provides metric examples to guide design.
  serves_needs:
  - need_id: lcb-q1
    how: 'Directly addresses LCB Q1 (350 words): defines lasting community benefits as program value; requires a Planning
      Document for Early Infrastructure projects; lists four strategies (policy, planning, programs, infrastructure) with
      examples; specifies metrics framework for tracking outcomes over time.'
  - need_id: ehcrp-r2-webinars-office-hours
    how: This is TA guide material; complements webinars and office-hours Q&A by providing written reference on LCB expectations.
  sections:
  - sid: s3
    path: 'What You Need To Know: > Understanding Lasting Community Benefits as a Program Value'
    type: need-statement
    reuse_value: medium
    note: Defines LCB as program value; explains planning document requirement; connects to long-term resilience and community-driven
      momentum. Useful for framing LCB section of application.
  - sid: s4
    path: 'What You Need To Know: > Types of Lasting Community Benefits'
    type: method
    reuse_value: high
    note: 'Framework of four strategy types with examples: policy change, thoughtful planning, new programs, effective infrastructure.
      Directly scaffolds lcb-q1 answer structure.'
  - sid: s8
    path: 'What You Need To Know: > Effective Infrastructure'
    type: method
    reuse_value: medium
    note: Examples of scalable/replicable cooling infrastructure and monitoring systems; includes prompts on governance, community
      stewardship, long-term care—useful for Bay Point planning.
  - sid: s9
    path: 'What You Need To Know: > Evaluating Lasting Community Benefits'
    type: method
    reuse_value: high
    note: 'Three-step framework for metrics development: envision outcomes, translate to indicators, track by whom/when. Directly
      supports lcb-q1 outcome-measurement requirement.'
  fact_candidates:
  - Planning Document is a required central part of Early Infrastructure projects, not an afterthought (s3)
  - 'Four strategy categories for lasting community benefits: policy change, thoughtful planning, new programs, effective
    infrastructure (s4)'
  - 'Sample heat-impact metrics: % increase in canopy cover, °F reduction in surface temps, hours of usable shade added per
    day (s11)'
  - 'Sample belonging metrics: total population reached, reduced exposure for impacted groups, community satisfaction, people
    engaged in planning (s12)'
  - 'Sample implementation metrics: trees planted, cool roofs installed, tree survival rate at 1 and 3 years, sq. ft. of reflective
    pavement (s13)'
  - 'Sample systemic-change metrics: policies created/updated, partnerships established, datasets created, departments integrating
    heat into planning (s14)'
  - LCB strategy examples include policy (cool-roof codes, zoning, heat-emergency ordinances), planning (parks/transportation
    master plans, community adaptation plans), programs (cooling centers, weatherization, heat-alert networks) (s5–s7)
  flags:
  - Excerpt coverage is thin for s8 (only opening ~437 words of section visible; prompt list cut off—full prompts not shown)
  - Sections s10 and later are headers + tables/lists; content may extend beyond the ~120-word limit shown
  - This is TA guidance, not a live application or planning document; use to understand requirements, not to extract applicant
    language
