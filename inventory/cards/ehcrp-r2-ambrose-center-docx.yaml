asset_id: ehcrp-r2-ambrose-center-docx
card:
  summary: Internal working document for Hyphae Design Lab's EHCRP Round 2 grant strategy, capturing program guidelines, partner
    outreach notes, meeting transcripts, and draft pre-application forms for Ambrose Center Park and related Bay Point projects.
    Extensive evidence of team coordination (Hyphae + I-ReLab), emerging strategic insights on harm reduction and belonging,
    and partial pre-app submission artifacts. High noise-to-signal ratio due to meeting notes, templates, and administrative
    churn.
  doc_role: working-doc
  authorship: Hyphae Design Lab + I-ReLab (kj, Brent Bucknum, Ivan Heitmann, Mei, Chris Lim, James Hansen)
  disposition: hold
  disposition_reason: Contains draft pre-application text and evolving project framing for Ambrose Center Park EHCRP submission;
    captures strategic thinking on partnership approach, harm reduction, and belonging applicable to future proposals; Hyphae
    firm experience narrative (Prescott, West Oakland) and template outreach language are reusable. Near-duplicates exist
    but this is the primary working snapshot. Noise is high (meeting transcripts, administrative lists, duplicate sections)
    but core pre-app sections (s114–s121) and strategic framing (s30–s34, s49) justify retention for extraction.
  serves_needs:
  - need_id: overview
    how: s114 describes demonstration project (UTCI modeling, nature-based cooling) at Ambrose Center Park; lacks full deliverables
      and contract-period task sequence; pre-app form structure is incomplete.
  - need_id: pt-q1
    how: s45, s64, s73 name Ambrose Park Community Org, RCD, SOS Richmond as potential partners; lacks detail on unique expertise
      or why single org could not succeed.
  - need_id: pt-q2
    how: s64, s93 mention Ambrose has existing master plan and CEQA underway; no prior collaboration outcomes or lessons from
      past joint projects shown.
  - need_id: lcb-q1
    how: s34 identifies relational infrastructure and stewardship as strategic themes; s104 (Prescott case) shows long-term
      funding and phased approach but not yet applied to Ambrose.
  - need_id: ehcrp-r2-webinars-office-hours
    how: s8, s18, s19 contain office hours dates (July 9, 13), webinar links (Tempe, Phoenix examples), and registration info
      for Round 2 guidance sessions.
  - need_id: moodle-application-template
    how: s75 references template stored in Moodle; document does not contain the template itself, only a pointer to it.
  - need_id: past-hyphae-proposals-overview
    how: s104 (Fresno example) and partial Prescott narrative (West Oakland AB 617, TCC, air quality monitoring, tree planting);
      more detail needed on outcomes and metrics.
  sections:
  - sid: s31
    path: '2026 Hyphae + I-ReLab: EHCRP > Introduction > June 16, 2026 > Applicant''s role'
    type: capability
    reuse_value: high
    note: Clear articulation of Hyphae's role in translating community relationships into fundable projects; positioning on
      partnership formation, demonstration project development, belonging, storytelling, stewardship planning.
  - sid: s34
    path: '2026 Hyphae + I-ReLab: EHCRP > Introduction > June 16, 2026 > Emerging Strategy'
    type: method
    reuse_value: high
    note: 'Strategic principle: work begins with partners, not projects; relationship-first approach to grant development
      and long-term stewardship. Directly applicable to future site-partner permutations.'
  - sid: s49
    path: '2026 Hyphae + I-ReLab: EHCRP > Introduction > June 16, 2026 > Strategic Reflection'
    type: method
    reuse_value: high
    note: Distinction between physical and relational infrastructure; stewardship and governance as success conditions for
      climate infrastructure. Reusable framing for belonging and lasting benefit questions.
  - sid: s104
    path: Fresno EHCRP example > Past Proposals > Firm Experience
    type: project-case
    reuse_value: high
    note: 'Prescott Greening Project case study (2021–2024): AB 617, TCC funding $150k + $300k MTC + $600k local match, air
      quality monitoring, vegetated buffers, tree planting in West Oakland Prescott. Detailed funding streams and phased approach.'
  - sid: s114
    path: Pre-application
    type: solicitation-text
    reuse_value: medium
    note: 'Draft pre-application narrative for Ambrose Center Park: UTCI modeling, nature-based cooling, park infrastructure
      (plaza, parking, ballfields, garden). Incomplete but captures project concept and deliverable intent.'
  - sid: s9
    path: '2026 Hyphae + I-ReLab: EHCRP > Introduction > Program Funding and Purpose'
    type: solicitation-text
    reuse_value: medium
    note: 'EHCRP Round 2 funding summary: $27.5M, Early Infrastructure $7.5M ($750k–$1.2M awards), Advanced Infrastructure
      $20M ($3M–$4.5M). Climate Bond + GGRF; key program framing.'
  - sid: s11
    path: '2026 Hyphae + I-ReLab: EHCRP > Introduction > Grant Types and Available Funds'
    type: solicitation-text
    reuse_value: medium
    note: 'Grant tier definitions: Early Infrastructure (planning doc + 30-month demo), Advanced Infrastructure (implementation
      + 48-month, prior planning required).'
  - sid: s7
    path: '2026 Hyphae + I-ReLab: EHCRP > Introduction > The key deadlines'
    type: solicitation-text
    reuse_value: medium
    note: 'Key dates: Pre-app Window 1 closes July 21, 2026, 2 PM; Window 2 closes Aug 11, 2026, 2 PM; Full app due Oct 13,
      2026, 2 PM.'
  fact_candidates:
  - 's9: $27.5 million in competitive infrastructure grant funding for EHCRP Round 2'
  - 's11: Early Infrastructure allocates $7.5 million for awards between $750,000 and $1.2 million'
  - 's11: Advanced Infrastructure allocates $20 million for awards between $3 million and $4.5 million'
  - 's11: Early Infrastructure projects must be completed within 30 months'
  - 's11: Advanced Infrastructure projects must be completed within 48 months'
