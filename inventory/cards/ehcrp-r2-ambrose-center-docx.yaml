  - 's104: Prescott Greening Project period 2021–2024'
  - 's56: EHCRP Round 1 distributed nearly $32 million across 46 projects in FY 2024–25'
  flags:
  - Internal working document with meeting transcripts, action items, and administrative notes; substantial noise (team member
    contact info redacted, task checklists, duplicate navigation structures).
  - Near-duplicate of ehcrp-r2-ambrose-center-gdoc (96%) and nearly identical to ehcrp-r2-ambrose-memorial versions (93–96%);
    mark all as same asset family; triage one.
  - Pre-application form sections (s114–s121) are incomplete; narrative for Ambrose Center Park is draft and likely revised
    post-submission. Do not cite as final.
  - s75 references Moodle application template but does not include it; template must be retrieved separately.
  - Prescott case (s104) lacks specific measurable outcomes and final results; shows process and funding but not impact metrics.
  - Partnership details (s45, s73) mention Ambrose Park Community Org, RCD, SOS Richmond, but no signed letters or confirmed
    co-applicant status evident in excerpts.
  - Strategic framing on harm reduction and belonging (s30–s34) is high-level and not yet connected to Bay Point-specific
    community data or lived experience narratives.
  - 'Context leakage risk: Team member names and email addresses redacted; reused passages may inadvertently carry internal
    references if extracted.'
  - Meeting notes dated July 22 and Aug 4, 2026 indicate this working doc is actively used for coordination; not yet finalized
    for library.
