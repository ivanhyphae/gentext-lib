asset_id: ehcrp-r2-nofa
card:
  summary: Official NOFA for Round 2 of California's Extreme Heat and Community Resilience Program, announcing $27.5 million
    in competitive infrastructure grants. Establishes eligibility, grant types (Early Infrastructure $750k–$1.2M; Advanced
    Infrastructure $3–$4.5M), co-applicant requirements, application process with two pre-application windows (June 16–July
    21 and July 1–August 11), scoring rubric (90 points plus 10-point interview), and technical assistance availability. Full
    applications due October 13, 2026.
  doc_role: solicitation
  authorship: California Governor's Office of Land Use and Climate Innovation (LCI) / Extreme Heat Program Staff
  disposition: reference
  disposition_reason: Authoritative source document establishing program rules, deadlines, funding amounts, and eligibility
    criteria. Essential reference for understanding application requirements and evaluation framework, but no prose to reuse
    into proposal sections.
  serves_needs:
  - need_id: overview
    how: Confirms infrastructure types eligible; establishes deliverables (planning document + demonstration project for Early
      tier; infrastructure implementation for Advanced tier); specifies 30-month contract period for Early Infrastructure
  sections: []
  fact_candidates:
  - '[s5] Total funding available Round 2: $27.5 million'
  - '[s5] Funding source: Climate Bond (Proposition 4) and Greenhouse Gas Reduction Fund'
  - '[s9] Early Infrastructure award range: $750,000 to $1.2 million per award; total pool $7.5 million'
  - '[s9] Advanced Infrastructure award range: $3 to $4.5 million per award; total pool $20 million'
  - '[s9] Early Infrastructure planning document + demonstration project must be completed within 30 months of grant award
    start date'
  - '[s10] Advanced Infrastructure construction must be completed within 48 months of grant award start date'
  - '[s12] Pre-Application Window 1: Opens June 16, closes July 21 at 2:00 PM PST'
  - '[s13] Pre-Application Window 2: Opens July 1, closes August 11 at 2:00 PM PST'
  - '[s13] Full Application submission deadline: October 13, 2026 (inferred from inventory note)'
  - '[s14] Narrative scoring: 55 points; Funding Priority Groups scoring: 15 points; workplan and budget: 20 points; interview/site
    visit: 10 points; total possible: 100 points'
  - '[s11] Co-Applicant requirement: Local/regional public entity lead requires CBO or Tribe co-applicant; CBO lead requires
    public entity or Tribe co-applicant; academic institution or Coalition lead requires both CBO and (public entity or Tribe)'
  flags:
  - excerpt too thin to judge; pre-application feedback and full application questions not shown in this NOFA excerpt
  - contact details redacted
  - document confirms Bay Point projects (Ambrose Center Park / Memorial Park) would be Early Infrastructure track at $750k–$1.2M
    with 30-month delivery window
