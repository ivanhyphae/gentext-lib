asset_id: ehcrp-r2-partnership-survey
card:
  summary: Official EHCRP Round 2 partnership survey responses (50k+ words across 84 sections) listing 40+ organizations across
    California seeking or offering collaboration on extreme heat resilience projects. Each entry includes org profile, mission,
    service areas, expertise, and project ideas. Entries span academic institutions (CSU East Bay), city/county agencies (San
    José, Fresno Parks), CBOs (Glide, Tree Davis, Valley Voices), tribes (Berry Creek Rancheria), legal aid (CRLA), labor
    (UDW), and environmental nonprofits (Our City Forest, Build It Green). Many entries identify potential co-applicants or
    partners for EHCRP proposals.
  doc_role: dataset
  authorship: LCI program (California Energy Commission)
  disposition: reference
  disposition_reason: Authoritative partner registry published by EHCRP program; not reusable proposal prose, but essential
    for identifying and vetting potential co-applicants, understanding partner capacity/expertise, and cross-referencing project
    ideas. Excerpts are structured survey data (org name, contact, mission, geography, skills, project ideas), not narrative
    or methodological content. Value is look-up and verification only.
  serves_needs:
  - need_id: lib-partners
    how: 40+ org profiles with missions, service areas, expertise areas, project experience, and contact info; enables vetting
      of potential co-applicants
  - need_id: ehcrp-r2-webinars-office-hours
    how: context for understanding partner landscape and collaboration options discussed in program convenings
  sections: []
  fact_candidates:
  - part 20 — Hyphae Design Lab, 456 8th St, Oakland, CA 94607, Max Pingeon Director of Development
  - 'part 12 — Our City Forest: 70,000 trees and 20,000 shrubs planted with ~150,000 volunteers and 500+ AmeriCorps members'
  - 'part 14 — Our City Forest: 85% staffing increase, 40% salary/benefit increase to $1,577,930; field operations expanded
    6 to 15 staff (150% increase); AmeriCorps cohort 20 current vs 24 prior year'
  - 'part 13 — Our City Forest: 30+ years of urban forestry work in Silicon Valley, ISA-certified arborists, 20–30 AmeriCorps
    members trained annually'
  - 'part 11 — San José: multiple census tracts designated as Disadvantaged Communities under SB 535; seek to build on EHCRP
    Round 1 Award'
  - 'part 27 — Fresno Parks (PARCS): ~200 employees, reports to Fresno City Manager, oversees Measure P sales tax funds'
  - 'part 27 — Fresno: 5th largest city in CA, 540,000 population, 20% poverty rate (vs 12% statewide)'
  - 'part 31 — Folsom Cordova Community Partnerships: Rancho Cordova ChillZone and HeatBeat Resilience Initiative mentioned
    as community-powered heat resilience effort'
  - 'part 32 — Berry Creek Rancheria: Federally Recognized Tribe, located Oroville, Butte County, focus on land restoration,
    health, TEK, energy'
  - 'part 34 — Tree planting goal: 15-gallon shade trees in schools, parks, community shared spaces in LIC/DAC priority areas'
  flags:
  - Excerpt too thin to judge content depth or quality — sections 43–84 (42 sections, ~25k words) appear empty or truncated
    in provided outline
  - Contact data redacted ([email], [phone])
  - High-value reference for partner vetting but not content to extract as reusable proposal text
  - Possible overlap with past EHCRP survey data — unclear if this is Round 2 refresh or newly published
  - Near-complete dataset suggests this is a master registry; confirm version date (modified 2026-09-01) and whether LCI has
    published curated subset for Bay Point applicants
