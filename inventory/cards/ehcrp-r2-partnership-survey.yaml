asset_id: ehcrp-r2-partnership-survey
card:
  summary: Program-published registry of 84 California organizations responding to EHCRP Round 2 partner-seeking survey. Each
    entry includes org name, mission, service populations, geographic focus, identified projects, expertise areas, and partnership
    needs. Contains contact info (redacted), org type, and self-assessed skills. Entries span San Francisco Bay Area, Central
    Valley, Sacramento Valley, and San Joaquin Valley. Notable entries include Hyphae Design Lab (listed as contributor),
    Our City Forest (urban forestry), San José (EHCRP R1 awardee seeking expansion), Tree Davis, United Domestic Workers,
    and tribal/CBO partners.
  doc_role: dataset
  authorship: LCI / EHCRP Program
  disposition: reference
  disposition_reason: Authoritative registry for partner identification and outreach. Contains no reusable prose, but is essential
    reference for understanding available partner ecosystem, checking entity eligibility, and validating contact information
    for Bay Point applications (ARPD, Ambrose projects) and future LCI solicitations. Hyphae entry confirms internal self-description
    for consistency check.
  serves_needs:
  - need_id: lib-partners
    how: Complete registry of potential co-applicants and partner organizations with stated expertise, service areas, and
      prior EHCRP experience; enables partner vetting and capacity assessment
  sections:
  - sid: s20
    path: Hyphae Design Lab entry
    type: org-profile
    reuse_value: medium
    note: Self-description of Hyphae's mission, geographic scope (Bay Area, LA County, Central Valley, Dallas, Philadelphia,
      Minneapolis), expertise (climate modeling, green infrastructure, data-driven design, heat-risk zones, farmworker protection),
      and EHCRP role (Contributor, Early Transformative). Confirms firm positioning and prior work products (LA County heat-risk
      dataset).
  - sid: s12
    path: Our City Forest (OCF) entry
    type: org-profile
    reuse_value: medium
    note: 30+ years urban forestry, 70,000 trees planted, AmeriCorps Climate Corps program (20–30 annually), ISA-certified
      arborists, deep equity commitments. Relevant for tree stewardship and co-planting partnerships in San José / Santa Clara
      County.
  - sid: s16
    path: Our City Forest (OCF) continued
    type: org-profile
    reuse_value: medium
    note: 'Technical depth: concrete removal, soil remediation, ANSI A-300 compliance, multi-year stewardship. Community partnerships
      in East San José, Alviso, Central San José. Workforce development and stewardship model.'
  - sid: s11
    path: City of San José entry
    type: org-profile
    reuse_value: medium
    note: EHCRP Round 1 awardee seeking expansion funding for cooling centers at city facilities. Identifies DACs in San José
      under SB 535. Demonstrates LCI track record and ongoing commitment.
  fact_candidates:
  - 'Hyphae Design Lab: active projects in Bay Area, Los Angeles County, Central Valley, Dallas, Philadelphia, Minneapolis'
  - 'Our City Forest: 70,000 trees and 20,000 shrubs planted over 30+ years'
  - 'Our City Forest: AmeriCorps Climate Corps cohort 20–30 members annually'
  - 'Our City Forest: 150,000 volunteers and 500+ AmeriCorps service members across organization history'
  - 'Our City Forest: staffing expanded 150% in field operations (6 to 15 staff) with $1.58M salary/benefits budget'
  - 'Our City Forest: decline from 24 to 20 full-time AmeriCorps members in recent cohort'
  - 'San José: 540,000 population, 5th largest California city'
  - 'San José: 20% poverty rate vs. 12% statewide (67% above state average)'
  - 'San José: multiple census tracts designated DAC under SB 535'
  - 'Hyphae: LA County heat-risk dataset produced with Accelerate Resilience L.A. and County Chief Sustainability Office'
  flags:
  - 'Excerpt coverage very thin: sections s2–s84 are outline headers only with no text; only sections s1–s21 contain substantive
    content; unable to fully assess 63 of 84 organizations'
  - Contact data redacted as [email]/[phone] throughout
  - Hyphae entry self-reported (internal source); validate independently against portfolio and past proposals if needed
  - San José EHCRP R1 awardee entry suggests existing competitive relationship; clarify before Ambrose applications
  - Registry is snapshot at 2026-09-01; org capacity, contacts, and project status may have shifted since publication
