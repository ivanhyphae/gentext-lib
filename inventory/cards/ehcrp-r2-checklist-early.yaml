asset_id: ehcrp-r2-checklist-early
card:
  summary: Compliance checklist for LCI EHCRP Round 2 Early Infrastructure Grant applications, listing required documents
    and deliverables (project location, feasibility, team roles, financial statements, nonprofit certifications, funding priority
    justifications). Organized by responsible party and cross-referenced to program guidelines sections.
  doc_role: solicitation
  authorship: LCI (Late-Stage Infrastructure / Early Infrastructure grant program)
  disposition: reference
  disposition_reason: Authoritative checklist needed to track compliance requirements; not prose to reuse but essential lookup
    document for Bay Point applications.
  serves_needs:
  - need_id: overview
    how: 'Names required deliverable: geographic area description and project feasibility documentation.'
  - need_id: pt-q1
    how: Identifies lead and co-applicant as required parties; implies documentation of team roles and expertise.
  sections:
  - path: part 1
    type: solicitation-text
    reuse_value: high
    note: 'Core compliance matrix: geographic description, feasibility, location, CBO office location requirements for Early
      Infrastructure.'
  - path: part 2
    type: solicitation-text
    reuse_value: medium
    note: Financial and governance requirements (audits, Form 990, 501(c)(3), SDAC/DAC justification) cross-referenced to
      program guidelines.
  fact_candidates:
  - Early Infrastructure applicants may not have specific sites identified yet but must describe intended area to best of
    their ability (part 1)
  - CBO office must be within 100 miles of project site (part 1)
  - Lead applicant and co-applicants must provide audit findings from last five years, if applicable (part 2)
  - Nonprofit organizations must submit most recent IRS Form 990 (part 2)
  - Nonprofit organizations must submit IRS 501(c)(3) Tax Determination Letter (part 2)
  flags:
  - Near-duplicate of ehcrp-r2-checklist-advanced (80% overlap); consider consolidation.
  - Excerpts do not include full checklist items; detailed compliance requirements may be incomplete in evidence presented.
  - Document is xlsx (spreadsheet); outline may not capture all columns/structure.
