asset_id: ehcrp-r2-meaningful-direct-benefits
card:
  summary: California state guidance document defining the four-step evaluation framework for assessing whether 2024 Climate
    Bond projects provide "meaningful and direct benefits" to disadvantaged communities (DACs), severely disadvantaged communities
    (SDACs), and vulnerable populations. Establishes legal definitions (income thresholds, vulnerability criteria), lists
    eligible benefit types by bond chapter (heat, water, wildfire, coastal, biodiversity, parks, clean air), and provides
    sample assessment questions and engagement best practices.
  doc_role: guidance
  authorship: California Natural Resources Agency (CNRA)
  disposition: reference
  disposition_reason: Authoritative state definition of a 15-point scoring criterion central to LCI EHCRP Round 2 applications;
    needed for accurate interpretation of solicitation requirements but not prose to extract or reuse verbatim.
  serves_needs: []
  sections:
  - sid: s9
    path: 'Chapter 5: Extreme Heat Mitigation'
    type: solicitation-text
    reuse_value: high
    note: Direct alignment with EHCRP heat infrastructure focus; lists 10 eligible community benefits (cooling, heat protection,
      flood risk, stormwater, air quality, energy savings, park access, emergency coordination, awareness, GHG reduction).
  - sid: s19
    path: 'APPENDIX B: Sample Questions for Assessing and Verifying Meaningful and Direct Benefits'
    type: template
    reuse_value: medium
    note: Checklist format for verifying DAC/vulnerable population benefits; transferable framing for partnership and engagement
      sections of proposals.
  - sid: s21
    path: Meaningful Engagement Best Practices
    type: boilerplate
    reuse_value: medium
    note: Best-practice language on co-visioning, power dynamics, decision-making roles, staff/board representation; directly
      applicable to Belonging and Partnership questions.
  fact_candidates:
  - 's2: 40 percent of total 2024 Climate Bond funding required for projects providing meaningful and direct benefits to vulnerable
    populations or DACs'
  - 's2: At least 10 percent of total funding required for projects providing meaningful and direct benefits to SDACs'
  - 's3: DAC definition—median household income less than 80 percent of area average or statewide median'
  - 's3: SDAC definition—median household income less than 60 percent of area average or statewide median'
  - 's12: Community minimum size—at least 10 dwellings adjacent or in close proximity'
  - 's14: CalEnviroScreen and California Climate Investments Priority Populations Mapping Tool cannot be used to identify
    DACs or SDACs for Climate Bond funding due to definition differences from SB 535 and AB 1550'
  - 's17: Park-poor threshold—less than 3 acres of usable parkland per 1,000 residents OR median household income less than
    80% statewide average with inadequate recreation access'
  flags:
  - excerpt too thin to judge comprehensiveness of benefit types for Ambrose applications
  - document is evergreen and may be updated periodically—current version date not stated in metadata
  - does not address EHCRP-specific scoring or implementation details beyond general framework
