asset_id: urban-greening-2026-guidelines
card:
  summary: 'CNRA Urban Greening Grant Program 2026 solicitation guidelines with application forms, evaluation criteria, and
    compliance requirements. Authorizes $46.125M in Climate Bond funding for nature-based solutions to mitigate urban heat
    island effect, rising temperatures, and extreme heat impacts. Minimum award $200K, maximum $5M. Eligible applicants include
    public agencies, nonprofits, tribes, and utilities. Two-stage process: Concept Proposals (due May 4–June 4, 2026) followed
    by Full Proposals. Evaluation rubric scores 0–70 points for project merit (extreme heat threat, community benefits, readiness,
    design quality, leverage) plus up to 30 bonus points for Climate Bond priorities (disadvantaged/severely disadvantaged
    communities, vulnerable populations). Requires 20–25 year operation & maintenance commitment. Appendices include concept
    and full proposal forms, glossary, CHAT instructions, tribal consultation, and environmental compliance guidance.'
  doc_role: solicitation
  authorship: California Natural Resources Agency (CNRA)
  disposition: reference
  disposition_reason: Authoritative source document defining Urban Greening program rules, timelines, scoring rubric, and
    application procedures. Not prose to reuse, but essential reference for Bay Point applicants to understand eligibility,
    funding caps, Climate Bond priorities, disadvantaged community thresholds, and compliance deadlines. EHCRP is a separate
    program; this document is contextual only.
  serves_needs: []
  sections: []
  fact_candidates:
  - 'Available Funding: $46,125,000'
  - 'Minimum award: $200,000; Maximum award: $5,000,000'
  - 'Concept Proposal Solicitation Period: May 4 – June 4, 2026'
  - Projects must be completed by no later than March 1, 2030
  - Non-construction costs limited to 25 percent of grant funds
  - Climate Bond requires at least 40 percent of funding for projects benefiting vulnerable populations or disadvantaged communities
  - 'Operation & Maintenance commitment: At least 20 years for grants up to $1 million; At least 25 years for grants over
    $1 million'
  - 'Indirect costs: grantee may choose negotiated rate, federally approved rate (if available), or de minimis rate of 15
    percent of modified total direct costs'
  - Up to 30 additional points for meeting Climate Bond Funding Priorities (total 100 possible points)
  - 'Two data layers required in CHAT: Annual Number of Health Events and Heat Health Action Index'
  flags:
  - This is Urban Greening, not EHCRP Round 2 (Early Infrastructure)—different programs with different timelines and priorities
  - No direct connection to Bay Point applications visible; inventory_note was empty and document does not mention Ambrose
    or Bay Point
  - Concept Proposal deadline May 4–June 4, 2026 is earlier than EHCRP Round 2 full application deadline (Oct 13, 2026)
  - Useful for context on state climate-funded greening criteria but not a primary source for EHCRP application strategy
