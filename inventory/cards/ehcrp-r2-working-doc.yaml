card:
  summary: Working document for Hyphae + I-ReLab's exploratory EHCRP Round 2 track. Contains strategic notes from webinar
    takeaways, partner development ideas, decision logs from team meetings (July 22, Aug 4, Aug 5), pre-application checklists,
    template letters, and firm experience language. Focus is on early-stage planning and partnership formation, not yet a
    submitted application. Metadata notes this is separate from the ARPD pre-applications but informs strategy. Heavy presence
    of meeting transcripts, action items, and internal notes.
  doc_role: working-doc
  authorship: I-ReLab (Dr. kj) with Hyphae team (Brent Bucknum, Ivan Heitmann, Chris Lim, James Hansen, Mei)
  disposition: reference
  disposition_reason: Contains authoritative EHCRP program guidelines, webinar summaries, decision records, and reusable strategy
    framing, but not submitted proposal prose or project outcomes. Useful as a reference for understanding the exploratory
    I-ReLab track and program requirements, but the document is a draft working collection of notes and templates, not a final
    deliverable. The metadata's claim of I-ReLab-authored prose is present but thin; most valuable sections are program excerpts
    and meeting notes rather than original Hyphae/I-ReLab capability statements.
  serves_needs:
  - need_id: ehcrp-r2-webinars-office-hours
    how: Sections s19–s20 summarize July webinar schedule and City of Tempe/Phoenix project examples; s31–s36 contain Dr.
      kj's webinar notes and emerging strategy takeaways.
  - need_id: lib-methods
    how: Section s51 discusses relational infrastructure, stewardship, and community engagement frameworks; s32–s36 frame
      partnership formation and storytelling as methodological approaches.
  sections:
  - sid: s10
    path: Introduction > Program Funding and Purpose
    type: solicitation-text
    reuse_value: high
    note: $27.5M Round 2 EHCRP funding amount, sources (Climate Bond Prop 4, GGRF), and program purpose statement.
  - sid: s12
    path: Introduction > Grant Types and Available Funds
    type: solicitation-text
    reuse_value: high
    note: Early Infrastructure ($7.5M, $750k–$1.2M awards, 30-month delivery) and Advanced Infrastructure ($20M, $3–4.5M awards,
      48-month delivery) tier definitions and deliverable requirements.
  - sid: s8
    path: Introduction > The key deadlines for the Round 2 Extreme Heat and Community Resilience Program application process
      are
    type: solicitation-text
    reuse_value: high
    note: 'Key dates: Pre-App Window 1 (June 16–July 21, 2026 with TA); Window 2 (July 1–Aug 11, 2026 no TA); Full App due
      Oct 13, 2026; appeal windows.'
  - sid: s32
    path: Introduction > The Opportunity
    type: capability
    reuse_value: medium
    note: I-ReLab/Hyphae positioning on partnership, belonging, and lasting community benefits as core program pillars; role
      clarity for private consulting firms through partnerships.
  - sid: s33
    path: Introduction > Applicant's role
    type: capability
    reuse_value: medium
    note: Articulates Hyphae's supporting role in partnership formation, demonstration project development, storytelling,
      stewardship planning, and grant development alongside eligible lead applicants.
  - sid: s51
    path: Introduction > Strategic Reflection
    type: method
    reuse_value: medium
    note: Conceptual framing of relational infrastructure vs. physical infrastructure; integration of cultural intelligence
      and stewardship planning with heat resilience projects.
  - sid: s106
    path: Fresno EHCRP example > Firm Experience
    type: project-case
    reuse_value: high
    note: Prescott Greening Project case (2021–2024, $150k TCC + $950k other funding) with air quality, vegetation, tree planting,
      phased implementation narrative and metrics language.
  - sid: s108
    path: Fresno EHCRP example > Technical Capabilities
    type: capability
    reuse_value: medium
    note: 'Hyphae technical expertise summary: land cover classification, LiDAR/geospatial processing, GPU computing, UTCI
      heat modeling, pedestrian behavior simulation.'
