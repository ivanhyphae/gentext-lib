asset_id: ehcrp-r2-working-doc
card:
  summary: I-ReLab and Hyphae's internal strategy doc for exploratory EHCRP Round 2 applications. Contains solicitation excerpts,
    partner outreach notes, meeting transcripts, and draft template language. Emphasizes relationship-first approach, early
    infrastructure tier, and lists of potential partners (Ambrose Center Park / Memorial Park, bus stops, LA-based orgs).
    Marked as 90% duplicate of two ARPD pre-application docs.
  doc_role: working-doc
  authorship: I-ReLab (Dr. kj) with Hyphae team (Brent Bucknum, Ivan Heitmann, Mei, James Hansen, Chris Lim)
  disposition: ignore
  disposition_reason: Near-duplicate of ehcrp-r2-ambrose-memorial-docx and ehcrp-r2-ambrose-center-docx (90% overlap noted
    in metadata). Primarily internal strategy notes, meeting transcripts, and working outreach lists—not prose to extract.
    EHCRP guidelines sections can be referenced in solicitation docs if needed. Partner outreach and relationship-building
    context is valuable for understanding the exploratory track but does not contain reusable proposal text, site facts, or
    outcome data beyond what appears in the ARPD pre-apps.
  serves_needs:
  - need_id: ehcrp-r2-webinars-office-hours
    how: Document embeds office hours schedule, registration links (July 9, 13), webinar dates (July 28 Tempe, July 30 Phoenix),
      Q&A submission channel, and summary takeaways from webinars attended by kj (20-60% infrastructure requirement, emphasis
      on Harm Reduction and Belonging).
  - need_id: ehcrp-r1-interview-and-feedback
    how: References 'Round 1 Report' section with FY2024-25 awards list and project categories (Large/Small Implementation,
      Large/Small Planning); provides context for Round 2 strategy but does not contain interview materials or specific LCI
      feedback.
  sections:
  - path: 'Introduction > June 16, 2026: Notice of Funding Availability Extreme Heat and > The key deadlines for the Round
      2 Extreme Heat and Community Resilience Program application process are'
    type: solicitation-text
    reuse_value: high
    note: 'Complete deadline schedule: Pre-App Window 1 (July 21), Window 2 (Aug 11), Full App (Oct 13); appeals windows.
      Core reference material for all EHCRP applications.'
  - path: 'Introduction > June 16, 2026: Notice of Funding Availability Extreme Heat and > Program Funding and Purpose'
    type: solicitation-text
    reuse_value: high
    note: $27.5M total; Prop 4 and GGRF funding; purpose statement; heat mitigation and vulnerable population protection.
  - path: 'Introduction > June 16, 2026: Notice of Funding Availability Extreme Heat and > Grant Types and Available Funds'
    type: solicitation-text
    reuse_value: high
    note: Early Infrastructure ($7.5M, $750K–$1.2M per award, 30-month demo) and Advanced Infrastructure ($20M, $3–4.5M per
      award, 48-month implementation). Tier definitions critical for application strategy.
  - path: 'Introduction > June 16, 2026: Notice of Funding Availability Extreme Heat and > Scoring and Selection Process'
    type: solicitation-text
    reuse_value: high
    note: 90 points base (55 narrative, 15 Funding Priority Groups, 20 workplan/budget); top scorers advance to 10-point interview/site
      visit for 100-point total.
  - path: Introduction > Excuse the photo taken of my computer screen from my phone, it was a live webinar and I wanted to
      catch it before they moved to the next slide. > Applicant's role
    type: notes
    reuse_value: medium
    note: 'I-ReLab''s strategic positioning: support partnership formation, demonstration projects, belonging, storytelling,
      stewardship, framing—not lead the community. Reusable framing for Hyphae''s role in eligible-applicant partnerships.'
  - path: Introduction > Excuse the photo taken of my computer screen from my phone, it was a live webinar and I wanted to
      catch it before they moved to the next slide. > Emerging Strategy
    type: notes
    reuse_value: medium
    note: '''Work begins with partners, not projects''—relationship-first approach, align with community priorities before
      project design. Strategic principle for proposal framing.'
  - path: Fresno EHCRP example > Firm Experience
    type: capability
    reuse_value: high
    note: 'Hyphae firm experience summary: Prescott Greening (AB 617, TCC, $150K–$1.05M total), data-driven + community engagement
      model. Citable project case with funding sources and outcomes.'
  - path: Fresno EHCRP example > Technical Capabilities
    type: capability
    reuse_value: medium
    note: 'Hyphae technical expertise: land cover classification, LiDAR/geospatial, GPU computing, UTCI heat modeling, street
      view analysis. Reusable capability statement.'
