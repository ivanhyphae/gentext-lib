asset_id: ehcrp-r1-guidelines
card:
  summary: EHCRP Round 1 Final Guidelines (dated 29 January 2024) establish the competitive grant program administered by
    California's Office of Planning and Research to fund planning and implementation projects addressing extreme heat and
    urban heat island effects. The document defines program vision, values, applicant eligibility, partnership requirements,
    funding tiers (small/large planning and implementation grants), application procedures, scoring criteria, and grant administration.
    It emphasizes equity, community resilience, vulnerable communities, and multistakeholder partnerships as core principles.
  doc_role: solicitation
  authorship: California Office of Planning and Research (OPR)
  disposition: reference
  disposition_reason: Authoritative program guidelines needed to contextualize Round 2 requirements and scoring shifts; not
    prose to reuse but essential reference material for understanding solicitation intent and administration.
  serves_needs:
  - need_id: ehcrp-r2-preapp-feedback
    how: Round 1 guidelines establish baseline scoring and requirements against which Round 2 changes can be compared to understand
      what OPR now prioritizes
  sections: []
  fact_candidates:
  - SB 155 Public Resources Trailer Bill (2021) made available $25 million in 2022–23 fiscal year to OPR for EHCRP
  - By 2050, average heat-health events projected to last two weeks longer in Central Valley and four to ten times more often
    in Northern Sierra region
  - EHCRP staff hosted nine public listening sessions in Spring 2023 with over 800 registrants
  - Draft Guidelines released 2 October 2023 for public comment
  - EHCRP Round 1 Final Guidelines released 29 January 2024
  - 'Application period: 29 January 2024 – 7 May 2024'
  - 'Pre-Application Interest Form due: 7 May 2024, 5 p.m. PST'
  - 'Minimum program meeting/workshop budget: $5,000 for Small Planning/Implementation Grants, $20,000 for Large Planning
    Grants, $30,000 for Large Implementation Grants'
  - Indirect administrative costs may account for up to 20% of total EHCRP award
  - 'Anticipated grant end date: up to thirty months from start'
  flags:
  - This is Round 1 guidelines (dated Jan 2024); inventory note requests R1 vs R2 comparison but R2 guidelines not yet in
    collection
  - Excerpt coverage is thin for most sections; full document must be consulted for detailed scoring rubrics and activity
    eligibility lists
  - 'Near-duplicate risk: may overlap with Round 2 guidelines if both are retained'
  - Document contains extensive appendices (D-F) on resources, regions, and glossary; reuse value of appendix content not
    assessed given section selection rules
