asset_id: ehcrp-r1-guidelines
card:
  summary: EHCRP Round 1 Final Guidelines (January 2024), a 28,600-word solicitation document defining the program's scope,
    eligibility, application processes, scoring rubrics, and grant administration for planning and implementation projects
    addressing extreme heat and building community resilience. Establishes funding tiers (Small/Large Planning and Implementation
    Grants), partnership requirements, priority communities (heat-vulnerable, DAC, tribal, regional diversity), four implementation
    tracks (Public Awareness, Community Services, Built Environment, Nature-Based Solutions), narrative questions, and post-award
    support. Includes appendices on climate tools (CalAdapt, VCP, CCHVI), CA Climate Adaptation Strategy regions, and comprehensive
    glossary.
  doc_role: solicitation
  authorship: California Governor's Office of Planning and Research (OPR)
  disposition: reference
  disposition_reason: Authoritative program definition and scoring criteria essential for structuring Round 2 applications;
    R1 guidelines provide baseline for comparing what Round 2 may reward differently. Not prose to extract, but foundational
    reference material for all Bay Point applications.
  serves_needs:
  - need_id: ehcrp-r2-webinars-office-hours
    how: R1 guidelines predate R2; this document does not contain R2 webinars or office hours, but establishes the program
      framework that R2 builds upon.
  sections:
  - path: I. Program Overview
    type: solicitation-text
    reuse_value: high
    note: Defines EHCRP scope, funding sources (SB 155, $25M 2022-23), eligible activities (heat action plans, shade, reflectance,
      cooling, evaporative cooling), and multistakeholder partnership requirement.
  - path: II. Program Vision and Values
    type: solicitation-text
    reuse_value: high
    note: Five core values (Place & Belonging, Indigenous Land Stewardship, Co-Investments, Technology & Innovative Design,
      All Hazards Resilience) and four implementation tracks; directly relevant to framing Hyphae proposals.
  - path: III. Applicant Eligibility, Partnership, and Funding
    type: solicitation-text
    reuse_value: high
    note: Eligible applicants (local/regional public entities, tribes, CBOs, school districts); partnership tiers (Co-Applicant,
      Contributor, Supporter); DAC/heat-vulnerable community prioritization criteria.
  - path: IV. Planning Grants
    type: solicitation-text
    reuse_value: high
    note: Small Planning (<$500K, 24 mo) and Large Planning ($500K–$2M, 30 mo) structures, eligible activities, and timelines;
      directly applicable to Ambrose pre-applications.
  - path: V. Implementation Grants
    type: solicitation-text
    reuse_value: high
    note: Small Implementation (<$1M, 24 mo) and Large Implementation ($1M–$5M, 30 mo); four tracks (Awareness, Services,
      Built Environment, Nature-Based); eligible activities and site-control requirements.
  - path: VII. Application Narrative
    type: solicitation-text
    reuse_value: high
    note: Required narrative sections (Project Vision, Communities Served, Partnership & Engagement, Work Plan & Budget) with
      word limits and scoring rubrics; templates for Ambrose responses.
  - path: 'Appendix D: Climate Adaptation and Resilience Resources'
    type: solicitation-text
    reuse_value: medium
    note: Directed references to CalAdapt, VCP, CCHVI, Healthy Places Index, Regional Opportunity Index; essential tools for
      Bay Point vulnerability and heat assessment.
  - path: 'Appendix F: Glossary and Acronyms'
    type: solicitation-text
    reuse_value: medium
    note: Canonical definitions (Heat Vulnerable Community, Adaptive Capacity, Co-Benefits, etc.) useful for lib-glossary
      and consistent terminology across proposals.
  fact_candidates:
  - Program created by SB 155 Public Resources Trailer Bill (2021); $25 million awarded to OPR in 2022–23 fiscal year for
    EHCRP
  - Round 1 Final Guidelines issued 29 January 2024; Application period 29 January – 7 May 2024
  - Pre-Application Interest Form due 7 May 2024, 5 p.m. PST; Fall 2024 expected start date for awarded projects
  - 'Small Planning Grants: up to $500,000, up to 24 months; Large Planning Grants: up to $2,000,000, up to 30 months'
  - 'Small Implementation Grants: up to $1,000,000, up to 24 months; Large Implementation Grants: up to $5,000,000, up to
    30 months'
  - Nine public listening sessions held Spring 2023 (two general, two tribal, five regional); over 800 individuals registered
  - Program requires multistakeholder partnerships; minimum indirect administrative costs capped at 20% of award
  - 'Recommended budget allocation for workshops/TA: $5,000 (Small), $20,000 (Large Planning), $30,000 (Large Implementation)'
  - Heat-vulnerable communities defined as experiencing historical disinvestment, increasing heat events, inadequate infrastructure
    and tree canopy
  - 'Four implementation tracks: Track A (Public Awareness), Track B (Community Services), Track C (Built Environment), Track
    D (Nature-Based Solutions)'
  flags:
  - Document is R1 guidelines (2024-01-29); compare against R2 guidelines when released to identify scoring or eligibility
    shifts
  - Appendix D references Vulnerable Communities Platform (VCP) as 'under development'; confirm current VCP functionality
    for Bay Point tract data
  - No contact information or specific R2 details visible in excerpts; full guidelines are authoritative but thin on R2-specific
    changes
  - 'Potential context gap: inventory_note asks to ''compare R1 vs R2'' but this document is R1 only; R2 guidelines needed
    for comparative analysis'
