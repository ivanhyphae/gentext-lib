asset_id: ehcrp-r2-ambrose-memorial-gdoc
card:
  summary: Working document containing Hyphae + I-ReLab's EHCRP Round 2 strategic notes, partnership development materials,
    and a completed pre-application form for Ambrose Memorial Park (Bay Point, lead ARPD). Includes program guidelines summary,
    webinar takeaways, partner lists, internal meeting notes, and the filled pre-app form submitted to LCI by August 11 deadline.
    Heavy internal process documentation alongside the actual submitted application artifact.
  doc_role: submitted-proposal
  authorship: Hyphae Design Lab + I-ReLab (kj, Brent Bucknum, Ivan Heitmann, James Hansen, Chris Lim, others)
  disposition: hold
  disposition_reason: 'This is the actual submitted pre-application to LCI EHCRP Round 2 for ambrose-memorial-park. Sections
    s112–s119 comprise the formal application narrative and required fields; sections s3–s111 contain the firm''s strategic
    framing, program research, partnership analysis, and internal planning that led to the submission. Both layers are reusable:
    the application prose and design rationale (s112) serve as a citable case study; the strategic notes (s3, s32–s36, s51)
    and firm-experience boilerplate (s106–s111) are library-ready capability and method text. The pre-app feedback from LCI
    (once received) will be essential for full-application development and should be acquired separately.'
  serves_needs:
  - need_id: overview
    how: s112 describes infrastructure type (greening + cooling), demonstrates UTCI modeling and site-specific design (thermal
      comfort optimization, shade coverage, permeable surfacing, gathered spaces), situates within 30-month Early Infrastructure
      tier
  - need_id: hr-q1
    how: s112 mentions community input integrated into design but excerpt too thin to verify specificity of exposure pathways,
      named harms, or lived-experience data; flags deeper evidence gap
  - need_id: be-q1
    how: 's112 lists specific design elements: shade structures, picnic areas, permeable decomposed granite, tree/vegetation
      placement optimized for heavily used spaces; community input promised but not detailed in excerpt'
  - need_id: pt-q1
    how: s114–s116 structure indicates lead (ARPD) and co-applicant roles required; pre-app form fields reserve space but
      excerpts do not show named co-applicant credentials or unique expertise of each
  - need_id: lib-site-bay-point
    how: s112 anchors project to Ambrose Memorial Park, 125 Memorial Way, Bay Point, CA; provides UTCI modeling context and
      site-specific thermal design rationale
  - need_id: lib-methods
    how: s106–s108 and s112 document heat vulnerability modeling (UTCI simulations, digital twin modeling, parcel-scale geospatial
      analysis, LiDAR, street-view processing) and community engagement integration
  sections:
  - sid: s112
    path: Pre-application
    type: solicitation-text
    reuse_value: high
    note: Completed pre-app form for EHCRP Round 2 Early Infrastructure, submitted Aug 11, 2026. Includes project title, site
      address (125 Memorial Way), demonstration project narrative, design strategy (UTCI modeling, shade, permeable surfaces),
      and funding rationale. Citable as submitted application artifact and thermal-design case study.
  - sid: s3
    path: '2026 Hyphae + I-ReLab: EHCRP > Strategic notes and emerging opportunities'
    type: notes
    reuse_value: high
    note: Internal strategic synthesis of EHCRP Round 2 program requirements, deadlines, and partnership approach. Frames
      harm reduction, belonging, and lasting community benefits as core evaluation themes; articulates Hyphae's role in relational-infrastructure
      support. Reusable for future EHCRP proposals and program training.
  - sid: s32
    path: Introduction > Excuse the photo... > The Opportunity
    type: notes
    reuse_value: high
    note: 'Clarifies Hyphae''s positioning relative to EHCRP requirements: partnership, belonging, lasting community benefits,
      implementation readiness. Emphasizes relational infrastructure and stewardship planning as differentiators. Citable
      as firm philosophy for proposal framing.'
  - sid: s33
    path: Introduction > Excuse the photo... > Applicant's role
    type: notes
    reuse_value: high
    note: 'Articulates Hyphae''s support function in EHCRP context: partnership formation, demonstration project development,
      storytelling, stewardship planning, grant development. Emphasizes infrastructure as primary outcome with opportunity
      for relational/narrative framing.'
  - sid: s106
    path: Fresno EHCRP example > Firm Experience
    type: capability
    reuse_value: high
    note: 'Prescott Greening Project case (2021–2024, AB 617 + TCC funding): $150k + $300k + $600k + $50k + $100k integrated
      funding; air quality monitoring + vegetated buffers + tree planting. Demonstrates phased implementation, data integration,
      and multi-funder coordination. Reusable boilerplate for Hyphae capability statements.'
  - sid: s108
    path: Fresno EHCRP example > Technical Capabilities
    type: capability
    reuse_value: high
    note: 'Documents Hyphae technical toolkit: land-cover classification, parcel-scale geospatial analysis (meter scale),
      LiDAR processing, GPU cloud servers, street-view data, UTCI modeling, pedestrian-behavior simulation. Directly applicable
      to heat-mitigation proposal framing.'
  - sid: s51
    path: Introduction > Excuse the photo... > Strategic Reflection
    type: notes
    reuse_value: medium
    note: Conceptual distinction between physical and relational infrastructure; frames stewardship governance and community
      participation as necessary for climate infrastructure sustainability. Strategic thinking applicable to future partnership
      and belonging narratives.
  - sid: s36
    path: Introduction > Excuse the photo... > Emerging Strategy
    type: notes
    reuse_value: medium
    note: '''Work begins with partners, not projects'' philosophy; relationship-first approach prioritizes existing partner
      rootedness over project design primacy. Reusable framing for partnership development strategy.'
  - sid: s91
    path: Notes > July 22, 2026 - Partnership Workstream > Decisions
    type: notes
    reuse_value: medium
    note: 'Early Infrastructure tier clarification: 25% minimum infrastructure demonstration + 75% planning/research/engagement/belonging.
      Pre-app requires location address but not site control. County partnership adds credibility. Operational intelligence
      for future applications.'
  - sid: s106
    path: Fresno EHCRP example > Firm Experience
    type: project-case
    reuse_value: high
    note: 'Prescott Greening: documented outcomes ($1.2M+ integrated funding, phased tree planting, air quality monitoring
      integration), partnership structure (WOEIP lead), and funding coordination across AB 617, TCC, MTC, Alameda CTC, Port,
      CalFire. Citable precedent for multi-funder heat/greening projects.'
