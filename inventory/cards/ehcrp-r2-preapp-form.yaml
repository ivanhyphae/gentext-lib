asset_id: ehcrp-r2-preapp-form
card:
  summary: EHCRP Round 2 Pre-Application Interest Form (draft). A solicitation template with eligibility screening questions
    for the Extreme Heat and Community Resilience Program Round 2. Covers funding priority groups (Tribes, DACs, vulnerable
    populations), co-applicant requirements, and TA intake. Contains program definitions of Harm Reduction, Partnership, Belonging,
    and Lasting Community Benefits. Form structure and logic flow documented but without final application questions.
  doc_role: solicitation
  authorship: LCI (Integrated Climate Adaptation and Resilience Program) / Extreme Heat Program staff
  disposition: reference
  disposition_reason: Authoritative solicitation template showing pre-app intake logic and eligibility scaffolding; needed
    to understand what applicants will see and what TA gaps exist. Not prose to reuse, but essential context for understanding
    application pathway and staff feedback opportunities.
  serves_needs:
  - need_id: ehcrp-r2-webinars-office-hours
    how: Form signals TA availability and structures; actual webinar/office-hours content not present in document, but this
      is the intake form that routes applicants to TA.
  sections:
  - path: preamble
    type: solicitation-text
    reuse_value: high
    note: Program goals, four core principles (Harm Reduction, Partnership, Belonging, Lasting Community Benefits), and project
      type eligibility definitions. Citable for grant framing.
  - path: LCI - Public
    type: solicitation-text
    reuse_value: high
    note: Co-applicant requirement matrix by lead entity type (public entity, CBO, Tribe) with clear rules on pairing. Essential
      for partnership section of applications.
  fact_candidates:
  - Pre-app form targets Early and Advanced Infrastructure projects
  - Co-Applicant required for most lead types (with CBO exception under Eligibility Section 6)
  - Lead applicant entity types include local/regional public entities, CBOs, California Native American Tribes
  - 'Funding Priority Groups: Federally recognized Tribes, non-federally recognized Tribes on state consultation list, (S)DAC
    via 2024 Climate Bond map, Vulnerable Populations via VCP'
  - TA provider offers one-on-one meetings, email updates, frameworks/tools/templates, and application section review (not
    full drafting)
  - Form uses 2024 Climate Bond Disadvantaged Communities Map for DAC identification
  - Form uses Vulnerable Communities Platform for vulnerable population identification
  flags:
  - Draft form; final questions and formatting may vary on Submittable platform
  - Near-duplicate of ehcrp-r2-working-doc (52%), ehcrp-r2-ambrose-memorial-docx (51%), and ehcrp-r2-ambrose-center-docx (51%)
    — check if those docs contain additional program text or application-specific details
  - 'Excerpt coverage thin: sections 1–1c are mostly field/dropdown definitions; actual narrative application questions not
    present in this draft'
  - Modified 2026-07-22 (recent); monitor for final Submittable version launch
  - 'TA limitations stated: will not provide full application reviews or assist with drafting narrative'
