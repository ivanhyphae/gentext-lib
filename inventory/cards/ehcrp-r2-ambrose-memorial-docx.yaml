card:
  summary: Internal working document and pre-application snapshot for Ambrose Memorial Park EHCRP Round 2 submission. Contains
    strategic notes from Hyphae + I-ReLab team meetings (July–August 2026), EHCRP program guidelines and deadlines, partner
    development lists, prior notes on grant coordination, Hyphae firm experience boilerplate, and the filled pre-application
    form (Early Infrastructure tier, $750k–$1.2M, greening + UTCI modeling + community engagement). The document is 96–92%
    duplicated across four near-identical versions (center-park, memorial-park, Google Docs, DOCX exports).
  doc_role: working-doc
  authorship: 'Hyphae Design Lab + I-ReLab (team: kj, Brent Bucknum, Ivan Heitmann, Chris Lim, James Hansen, Mei); meeting
    notes by Mei'
  disposition: hold
  disposition_reason: 'Contains reusable pre-application language (project title, demonstration concept, UTCI methodology,
    partnership framing), Hyphae firm experience boilerplate with citable outcomes (Prescott Greening Project: $150k TCC +
    $300k MTC + $600k ACTC + $50k Port + $100k CalFire), template letter, and strategic guidance on EHCRP tier selection and
    co-applicant eligibility. Also captures internal decision-making and blockers useful for future similar solicitations.'
  serves_needs:
  - need_id: overview
    how: Project title, infrastructure type (urban greening + cooling), demonstration deliverables (UTCI modeling, shade structures,
      gathering infrastructure, permeable surfacing), key tasks (heat vulnerability modeling, tree placement optimization,
      community input integration) and 30-month contract window named in pre-application (s114, s117).
  - need_id: ehcrp-r2-preapp-feedback
    how: Document is the pre-application itself; contains no LCI staff feedback. This is the submission, not feedback on it.
  - need_id: past-hyphae-proposals-overview
    how: Section s104 includes Prescott Greening Project case (2021–2024, AB 617 + TCC funding, tree planting + air quality
      monitoring, $1.2M+) and references to Fresno County EHCRP, but the 'Past Proposals' section remains incomplete/partial.
  - need_id: lib-methods
    how: Sections s114, s117 detail UTCI (Universal Thermal Climate Index) simulations, digital twin modeling, tree placement
      optimization, shade coverage analysis, and integration of heat modeling with community input.
  - need_id: lib-site-bay-point
    how: Sections s114, s117 identify Ambrose Memorial Park, 125 Memorial Way, Bay Point, CA; note prior CEQA underway and
      existing master plan, but excerpt does not provide vulnerability data or community voices.
