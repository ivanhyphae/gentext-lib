asset_id: ehcrp-r2-planning-playbook-guide
card:
  summary: LCI EHCRP Round 2 guidance on required planning documents for Early Infrastructure projects. Explains that Early
    Infrastructure grants must produce either an Extreme Heat Action Plan or Infrastructure Master Plan alongside a demonstration
    project. The planning document should identify the problem (how/where extreme heat causes harm), develop a long-term strategy
    (10+ years) informed by data and community input, and test that strategy through infrastructure demonstration. The document
    then serves as a foundation for future implementation efforts.
  doc_role: guidance
  authorship: LCI (Extreme Heat and Community Resilience Program)
  disposition: reference
  disposition_reason: Authoritative guidance on application requirements and planning-document expectations for EHCRP Round
    2 Early Infrastructure track. Not prose to reuse, but essential reference for understanding what the planning document
    must contain and how it connects to the lcb-q1 answer.
  serves_needs:
  - need_id: lcb-q1
    how: Directly explains that the planning document must provide 'a long-term practical pathway for how you will implement
      these interventions' and drive future infrastructure efforts; identifies two acceptable document types (Extreme Heat
      Action Plan or Infrastructure Master Plan)
  sections:
  - sid: s8
    path: Finalized Planning DOCUMENT
    type: solicitation-text
    reuse_value: high
    note: 'Core explanation of Early Infrastructure planning-document requirements: document must evaluate what needs to be
      done, testing informs revisions, and document turns lessons learned into support for future efforts. Directly addresses
      lcb-q1 structure.'
  - sid: s9
    path: Intervention IDENTIFIED IN PREVIOUS WORK
    type: solicitation-text
    reuse_value: medium
    note: Application development steps and reference to example documents. Useful for scope/budget framing of planning-document
      work.
  fact_candidates:
  - '[s2] Early Infrastructure Planning Document must establish foundation for needed interventions and provide long-term
    practical pathway for implementation'
  - '[s7] Early Infrastructure Planning Document should define how and where extreme heat is causing harm in the area'
  - '[s7] Planning document should be a Heat Action Plan or Infrastructure Master Plan providing guidance over the next 10+
    years'
  - '[s8] Planning Document and infrastructure demonstration are two elements that inform each other'
  - '[s8] Infrastructure demonstration serves as testing of long-term strategy'
  flags:
  - 'Excerpt too thin to judge: section examples referenced but not shown; actual example documents (Example 1, 2, 3) not
    provided in excerpt'
  - No specific metrics, timelines, or deliverable descriptions beyond 'planning document type'
  - Inventory note mentions 'feeds LCB answer' — confirms relevance to lcb-q1 need
