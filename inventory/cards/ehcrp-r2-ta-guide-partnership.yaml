asset_id: ehcrp-r2-ta-guide-partnership
card:
  summary: TA guide for EHCRP Round 2 applicants on Partnership as a program value. Explains the distinction between lead
    applicants, co-applicants, contributors, and supporters; their roles, responsibilities, and funding flows. Includes a
    requirements table and prompts for applicants to consider when developing partnerships.
  doc_role: guidance
  authorship: LCI (Governor's Office of Land Use and Climate Innovation)
  disposition: reference
  disposition_reason: Authoritative guidance document defining partnership requirements and structure for EHCRP Round 2 applications.
    Not prose to reuse, but essential reference for understanding and answering pt-q1 and pt-q2 questions.
  serves_needs:
  - need_id: pt-q1
    how: 'Defines what strong partnerships must show: complementary expertise, shared decision-making, clear narrative of
      each partner''s contribution and relevant strengths.'
  - need_id: pt-q2
    how: Establishes partnership agreement requirements and post-award responsibilities; clarifies that workplan and budget
      must outline activities, deliverables, and costs per partner.
  sections:
  - path: 'What You Need To Know: > Understanding Partnership as a Program Value'
    type: solicitation-text
    reuse_value: medium
    note: Core definition of Partnership value emphasizing community knowledge + implementation capacity balance; directly
      addresses pt-q1 and pt-q2 expectations.
  - path: 'What You Need To Know: > Elements of Project Partnership'
    type: solicitation-text
    reuse_value: medium
    note: Requirements table distinguishing lead applicant, co-applicant, contributor, and supporter roles, responsibilities,
      funding eligibility, and documentation needs.
  fact_candidates:
  - Lead applicants must enter into grant agreement with the State to receive funds and subgrant to project partners.
  - Co-applicants receive funds through the Lead Applicant and must have workplan tasks and budget items.
  - Contributors provide support but do not receive grant funds and do not require detailed tasks or budget justification.
  - Supporters provide letters of support but do not receive funds or require workplan tasks or budget items.
  - Tribes are not required to have a Co-Applicant per program guidelines.
  flags:
  - 'Excerpt too thin to judge: final section on ''Prompts to consider'' is cut off mid-sentence, limiting visibility of full
    guidance scope.'
  - Document appears to be EHCRP Round 2 specific; verify applicability to Hyphae's Bay Point proposals.
