asset_id: ehcrp-r2-ta-guide-partnership
card:
  summary: EHCRP Round 2 technical guidance on Partnership as a program value. Defines partnership structure (Lead Applicant,
    Co-Applicant, Contributors, Supporters); outlines roles, responsibilities, and application requirements for each tier;
    provides prompts for applicants to strengthen partnership design.
  doc_role: guidance
  authorship: LCI / ICARP program
  disposition: reference
  disposition_reason: Authoritative program guidance needed to answer pt-q1 and pt-q2 questions; not prose to reuse but essential
    to consult when drafting partnership sections. Defines required elements and evaluation framing.
  serves_needs:
  - need_id: pt-q1
    how: Defines partnership roles and required documentation; guidance on demonstrating unique expertise of each partner
      and why single org cannot succeed
  - need_id: pt-q2
    how: Prompts (visible in excerpts) encourage documenting prior projects, milestones, and lessons; defines what 'proven
      capacity' means in this program context
  sections: []
  fact_candidates:
  - Round 2 funds Early and Advanced Infrastructure projects
  - Partnership value emphasizes complementary partnerships and shared decision-making
  - Lead Applicant receives grant funds as grantee; Co-Applicant receives funds through Lead Applicant
  - Lead Applicant must have workplan tasks and budget items; Contributors must have workplan tasks but not budget items
  - Supporters must provide letter of support but do not require workplan tasks or budget items
  - Co-Applicant must provide detailed tasks, letter of support, and costs to Lead Applicant
  - Lead Applicant serves as point of contact with Governor's Office of Land Use and Climate Innovation (LCI)
  flags:
  - Excerpt ends mid-sentence at s8; full 'Prompts to consider' section not shown—thin evidence on guidance depth for pt-q1/pt-q2
  - No site-specific or Hyphae-relevant examples in visible excerpts
  - Does not contain community voices or Bay Point context
