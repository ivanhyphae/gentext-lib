asset_id: ehcrp-r2-draft-guidelines
card:
  summary: 'EHCRP Round 2 Draft Guidelines (dated 2026-02-02) describing the Extreme Heat and Community Resilience Program
    structure, eligibility, project types, funding amounts, application process, and review criteria. Covers Early Transformative
    Infrastructure ($600k–$1M) and Advanced Transformative Infrastructure ($2.5M–$4M) projects with 30-month terms. Emphasizes
    four program values: harm reduction, collaboration, belonging, and transformation. Specifies eligible applicants (public
    entities, tribes, CBOs), partnership requirements, site control mandates, and funding location restrictions to Priority
    Populations. Details application timeline, technical assistance, scoring review, and grant administration.'
  doc_role: solicitation
  authorship: State of California, Governor's Office of Land Use and Climate Innovation (LCI)
  disposition: reference
  disposition_reason: Authoritative program guidelines defining eligibility, budget structures, values framework, and review
    process essential for proposal development. Not prose to reuse; must be consulted for specific requirements and constraints.
  serves_needs:
  - need_id: ehcrp-r2-webinars-office-hours
    how: This is the foundational written guidance; webinars and office hours would elaborate on ambiguities and clarify interpretation
      of sections like application phases, scoring criteria (referenced but in Appendix X, not shown), and partnership requirements.
  sections:
  - sid: s4
    path: Guideline Overview
    type: solicitation-text
    reuse_value: high
    note: 'Core program definition: what activities are funded, project types, funding amounts, eligibility overview—essential
      reference for all proposal scope framing.'
  - sid: s5
    path: Program Values
    type: solicitation-text
    reuse_value: high
    note: Four values (harm reduction, collaboration, belonging, transformation) and their definitions; directly shapes application
      answers and proposal narrative framing.
  - sid: s6
    path: Project Types
    type: solicitation-text
    reuse_value: high
    note: Comparison of Early vs. Advanced Transformative Infrastructure, award ranges, budget allocation minimums (25–60%
      vs. 70% infrastructure); critical for project type selection.
  - sid: s9
    path: Project Phases Values
    type: solicitation-text
    reuse_value: high
    note: Links five project phases to four program values with concrete questions; directly informs workplan structure and
      narrative alignment.
  - sid: s12
    path: Early Transformative Infrastructure
    type: solicitation-text
    reuse_value: high
    note: 'Budget requirements: $600k–$1M award, 25–60% infrastructure, 15% partnerships, 5% belonging minimum; specific to
      Bay Point projects.'
  - sid: s13
    path: Built Environment Solutions for Extreme Heat
    type: solicitation-text
    reuse_value: medium
    note: Categories of eligible solution areas (nature-based and built environment); helps scope infrastructure options.
  - sid: s14
    path: Built Environment for Extreme Heat
    type: solicitation-text
    reuse_value: medium
    note: Detailed examples of eligible built-environment planning activities (cool pavements, corridors, transit cooling,
      heat action plans); informs infrastructure design narrative.
  - sid: s15
    path: Nature-Based Solutions for Extreme Heat
    type: solicitation-text
    reuse_value: medium
    note: Examples of eligible nature-based planning (forestry, pocket forests, cool corridors, green stormwater, water-based
      cooling, restoration); supports design rationale.
  - sid: s16
    path: Advanced Transformative Infrastructure
    type: solicitation-text
    reuse_value: high
    note: Budget range $2.5M–$4M, 70% infrastructure minimum, 10% partnerships, 5% belonging; contrasts with Early type.
  - sid: s25
    path: Applicant Team and Partnership Requirements
    type: solicitation-text
    reuse_value: high
    note: Mandatory site control requirement, applicant team roles (lead, co-applicant, contributor, supporter), intermediary
      provisions for private sites; critical for partnership design.
  - sid: s26
    path: Funding Goals
    type: solicitation-text
    reuse_value: high
    note: 100% funding in Priority Populations (California Climate Investments Mapping Tool 4.0); additional points for tribes
      and disadvantaged communities; geospatial constraint.
  - sid: s27
    path: Application Process
    type: solicitation-text
    reuse_value: high
    note: Pre-application timeline (opens April X, closes Month X), full application window, technical assistance availability,
      Submittable platform; operationally critical.
  - sid: s28
    path: Application Review
    type: solicitation-text
    reuse_value: high
    note: 'Three-stage review: eligibility, interagency panel scoring (criteria in Appendix X), final interview on workplan/budget;
      defines evaluation path.'
  - sid: s29
    path: Application Support
    type: solicitation-text
    reuse_value: medium
    note: Technical assistance availability prioritized for Priority Populations, tribes, and previously unfunded applicants;
      scope includes meetings, writing support, compliance review.
  - sid: s30
    path: California Native American Tribes
    type: solicitation-text
    reuse_value: high
    note: Tribe eligibility, 7-point scoring bonus, dedicated TA; relevant context for potential tribal partnership.
  - sid: s31
    path: Grant Administration
    type: solicitation-text
    reuse_value: medium
    note: Contract execution requirements, no reimbursement before execution, state transparency/audit standards; administrative
      baseline.
  - sid: s32
    path: Advanced Pay
    type: solicitation-text
    reuse_value: medium
    note: Up to 25% advance payment available for 501(c)(3) nonprofits under AB 590; relevant to partnership cash-flow planning.
  fact_candidates:
  - 'Award range for Early Transformative Infrastructure: $600,000 to $1,000,000 (s12)'
  - 'Award range for Advanced Transformative Infrastructure: $2,500,000 to $4,000,000 (s16)'
  - Early Transformative Infrastructure requires minimum 25% and up to 60% of budget for infrastructure (s12)
  - Advanced Transformative Infrastructure requires minimum 70% of budget for infrastructure (s16)
  - Early Transformative Infrastructure requires minimum 15% of budget for partnerships (s12)
  - Advanced Transformative Infrastructure requires minimum 10% of budget for partnerships (s16)
  - Minimum 5% of budget allocated to belonging-related activities in both project types (s12, s16)
  - Project term is 30 months maximum (s7)
  - 100% of EHCRP Round 2 funding must be invested in Priority Populations (s26)
  - Infrastructure must be located within Priority Populations per California Climate Investments Priority Populations Mapping
    Tool 4.0 (s7, s26)
  - Tribes receive 7 additional points in scoring if tribe is lead applicant or infrastructure on tribal land with tribe as
    co-applicant (s30)
  - Pre-application interest form submission platform is Submittable (s27)
  flags:
  - 'Excerpt too thin to judge: scoring criteria referenced as ''Appendix X'' but appendix not provided; full evaluation rubric
    unknown.'
  - 'Excerpt too thin to judge: application timeline shows ''April X'' and ''Month X'' as placeholders; exact dates not visible
    in draft.'
  - 'Draft document (dated 2026-02-02): inventory note flags diff against final version; final guidelines may differ; flagged
    for comparison when finalized.'
  - Section s3 shows table of contents only; no substantive content visible; actual guideline overview begins in s4.
  - Contains placeholder dates and appendix references; confirms this is draft status not final release.
