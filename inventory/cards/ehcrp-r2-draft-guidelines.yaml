  - Program invests 100% of funding in California Priority Populations
  - Infrastructure location requirement uses California Climate Investments Priority Populations Mapping Tool 4.0
  - Tribes serving as lead applicant or co-applicant on tribal land receive 7 additional scoring points
  - Pre-application and full application submitted through Submittable platform
