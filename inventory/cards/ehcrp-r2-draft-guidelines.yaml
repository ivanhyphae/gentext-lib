asset_id: ehcrp-r2-draft-guidelines
card:
  summary: EHCRP Round 2 draft grant guidelines (dated 2026-02-02) for the California Extreme Heat and Community Resilience
    Program. Covers program overview, values (harm reduction, collaboration, belonging, transformation), two project types
    (Early Transformative Infrastructure $600k–$1M; Advanced Transformative Infrastructure $2.5M–$4M), eligible applicants,
    partnership requirements, funding goals (100% in Priority Populations), application process with pre-application and full
    application windows, review and scoring, technical assistance availability, and grant administration. 30-month project
    term required. Infrastructure must be located in California Climate Investments Priority Populations areas.
  doc_role: solicitation
  authorship: California Governor's Office of Land Use and Climate Innovation (LCI)
  disposition: reference
  disposition_reason: Authoritative program requirements and scoring framework essential for application strategy, but prose
    is regulatory boilerplate not reusable for proposals. Will be superseded by final guidelines; inventory note flags value
    in diff against final version.
  serves_needs:
  - need_id: overview
    how: Defines Early vs. Advanced project types with budget ranges, deliverable structure (planning + demonstration vs.
      implementation), and 30-month term requirement
  - need_id: pt-q1
    how: 'Specifies partnership requirements: site control entity must be lead or co-applicant; minimum budget allocations
      for partnerships (15% Early, 10% Advanced); applicant team definition'
  - need_id: lcb-q1
    how: Priority Populations mapping requirement and funding commitment (100% in Priority Populations); mentions heat action
      plans as eligible planning products
