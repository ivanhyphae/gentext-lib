    how: 'Hyphae project case: Prescott greening, MTC-funded, demonstrates pollution-reduction and engagement within WOCAP
      framework; citable outcomes and multi-partner model (WOEIP + Hyphae).'
  - need_id: lib-methods
    how: Documents vegetation-based pollution mitigation strategy (green walls, vegetated buffers) with research citation
      (Alexeeff et al. 2018) and co-benefits integration (stormwater, health, place-making).
