asset_id: prescott-greening-proposal-2021
card:
  summary: 2021 proposal for the Prescott greening project in West Oakland, led by Urban Biofilter (WOEIP + Hyphae), funded
    by MTC and ACTC with co-funding from Port of Oakland and CalFire. Project applies vegetation-based pollution mitigation
    strategies (green walls, vegetated buffers) to reduce air exposure in West Oakland's highest pollution hotspot, part of
    the WOCAP (AB617) implementation. Total project estimated at ~$30 million with $300k MTC authorization and $600k+ match
    secured.
  doc_role: submitted-proposal
  authorship: Urban Biofilter (West Oakland Environmental Indicators Project & Hyphae Design Laboratory)
  disposition: hold
  disposition_reason: Citable project case with named outcomes (funding secured, infrastructure type, partner collaboration,
    health co-benefits framing) and research-supported methods (pollution-reducing vegetation, WOCAP context). Reusable for
    capability and methods library.
  serves_needs:
