asset_id: cnra-ugg-2026-concept-bay-point
card:
  summary: '2026 Urban Greening Grant Program concept proposal for Bay Point climate-resilient transit stops and workforce
    pathways, led by Contra Costa Resource Conservation District (CCRCD). Requests $4.217M to retrofit transit stops on priority
    corridors (e.g., Willow Pass Road) with shade trees, native vegetation, and green stormwater infrastructure to address
    extreme heat and improve public health in frontline community. Project runs Feb 2027–Feb 2030. Checks multiple climate
    benefits: extreme heat protection, GHG reduction, resilience, biodiversity, and workforce/monitoring capacity.'
  doc_role: proposal-draft
  authorship: Contra Costa Resource Conservation District (CCRCD); primary contact Chris Lim, secondary Adam Gelfand
  disposition: hold
  disposition_reason: 'Funder-neutral reuse test: same community (Bay Point) and similar infrastructure vision as EHCRP application;
    contains site-specific need statement, design rationale, and project structure that can inform library assets for site
    context and belonging/design elements. Draft status suggests incomplete but worth extracting proven framing.'
  serves_needs:
  - need_id: lib-site-bay-point
    how: Confirms Bay Point transit-rider heat exposure, lack of amenities, urban heat island conditions, and housing/transportation/economic
      challenges; names Willow Pass Road as priority corridor; establishes community vulnerability profile.
  - need_id: be-q1
    how: 'Describes specific design elements: shade trees, native vegetation, green stormwater infrastructure at transit stops;
      rooted in rider experience and frontline community identity.'
  sections:
  - sid: s2
    path: part 2 — Project description and rationale
    type: site-context
    reuse_value: high
    note: Concrete description of Bay Point bus-stop conditions, heat exposure, and design response (shade, vegetation, GSI);
      directly applicable to belonging and site facts.
  - sid: s4
    path: part 4 — Community vulnerability and project benefits
    type: need-statement
    reuse_value: high
    note: Articulates housing stability, transportation access, economic opportunity gaps; existing heat island and air quality
      concerns; positions bus stops as frequent-use community assets. Strong need foundation.
  fact_candidates:
  - 's1: Project location 3105 Willow Pass Rd, Bay Point, CA 94565; latitude 38.0289, longitude -121.9447'
