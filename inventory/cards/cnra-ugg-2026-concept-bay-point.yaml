  - 's1: Project start date February 1, 2027; end date February 28, 2030 (36 months)'
  - 's1: Applicant: Contra Costa Resource Conservation District, 2001 Clayton Road, Suite 200, Concord, CA 94520'
  - 's1: County Contra Costa, Senate District 9, Assembly District 15'
  - 's2: Bus stops currently consist of sign + pavement with no shade or amenities'
  - 's3: Project checks climate benefits: extreme heat, GHG reduction, resilience to heat/drought, biodiversity protection,
    workforce/monitoring capacity'
  - 's4: Residents face housing stability, transportation access, economic opportunity challenges related to climate response
    capacity'
