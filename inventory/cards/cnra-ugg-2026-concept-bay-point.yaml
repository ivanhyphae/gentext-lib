asset_id: cnra-ugg-2026-concept-bay-point
card:
  summary: 'CNRA Urban Greening Grant concept proposal for retrofitting Bay Point transit stops with green infrastructure
    (shade trees, native vegetation, GSI) to address extreme heat and build community resilience. Lead: Contra Costa Resource
    Conservation District (CCRCD). Budget: $4.2M over ~3 years (Feb 2027–Feb 2030). Framed as workforce pathways project;
    focuses on priority transit corridors in frontline community.'
  doc_role: proposal-draft
  authorship: Contra Costa Resource Conservation District (CCRCD)
  disposition: hold
  disposition_reason: Tests funder-neutral language and framing for same Bay Point site across two funders (EHCRP R2 vs. CNRA
    UGG); proposal prose on heat exposure, community vulnerability, and infrastructure rationale are directly reusable for
    EHCRP application. Site context, need statement, and design concept applicable across grant mechanisms.
  serves_needs:
  - need_id: lib-site-bay-point
    how: Names Willow Pass Road corridor as priority transit area; describes existing conditions (heat exposure, lack of amenities,
      pavement-dominant stops) and community vulnerability (housing, transportation, economic challenges).
  - need_id: lib-methods
    how: 'Describes retrofit approach: shade trees, native vegetation, green stormwater infrastructure as integrated heat-mitigation
      strategy; implies climate-ready species selection for drought resilience.'
  sections:
  - path: part 2
    type: need-statement
    reuse_value: high
    note: Specific, vivid description of Bay Point transit rider exposure to heat and lack of basic amenities; frames bus
      stops as frequently-used community spaces and opportunity for intervention.
  - path: part 4
    type: site-context
    reuse_value: high
    note: 'Documents vulnerability: housing instability, transportation access, economic opportunity challenges; urban heat
      island + air quality; establishes why transit stops matter as public spaces in daily life.'
  - path: part 3
    type: method
    reuse_value: medium
    note: Lists climate benefits and design elements (shade trees, native vegetation, GSI, climate-ready species); checklist
      format less prose-ready but captures integrated heat/resilience approach.
