- id: s-2026-09-25-gdrive-03
  date: 2026-09-25
  by: claude-opus-5-5
  system: gdrive
  method: Google Drive connector search_files by funder/program and by project name (metadata only, excludeContentSnippets, pageSize 40–50)
  queries:
    - "fullText contains 'Urban and Community Forestry' or title contains 'CalFire' or title contains 'CAL FIRE' or title contains 'UCF'"
    - "fullText contains 'Transformative Climate Communities' or title contains 'TCC' or title contains 'AB 617' or title contains 'AB617'"
    - "title contains 'STEP' or fullText contains 'Sustainable Transportation Equity' or fullText contains 'Sustainable Transportation Planning' or title contains 'Caltrans'"
    - "(title contains 'Urban Greening' or title contains 'CNRA' or title contains 'Strategic Growth Council' or title contains 'SGC') and not title contains 'Richmond'"
    - "(title contains 'EPA' or title contains 'Community Change' or title contains 'Environmental Justice') and (title contains 'application' or title contains 'Application' or title contains 'narrative' or title contains 'Narrative' or title contains 'proposal' or title contains 'Proposal' or title contains 'FINAL' or title contains 'Final' or title contains 'submitted')"
    - "title contains 'NSF' or title contains 'SBIR' or title contains 'NIH' or title contains 'NIEHS'"
    - "title contains 'Prescott' or title contains 'Stockton' or title contains 'vegetative barrier' or title contains 'Vegetative Barrier' or title contains 'Veg Buffer'"
    - "title contains 'Oakland STEP' or title contains 'STEP' or title contains 'Green Heart' or title contains 'AdaptOS' or title contains 'Depave' or title contains 'DePave' or title contains 'West Oakland'"
    - "(fullText contains 'Stockton' or fullText contains 'West Oakland' or fullText contains 'Green Heart' or fullText contains 'Prescott') and (title contains 'proposal' or title contains 'Proposal' or title contains 'application' or title contains 'Application' or title contains 'narrative' or title contains 'Narrative' or title contains 'FINAL' or title contains 'Final' or title contains 'submitted' or title contains 'Submission' or title contains 'report' or title contains 'Report')"
  found: 343
  recorded: 43
  notes: >
    40 new records + 3 updates. `found` counts results per query, so overlap between queries is heavy; roughly 200 distinct files were seen.
    Stopped after page 1 for every query. Each first page ran 13–50 results, and the tail of each was already low-relevance (meeting transcripts, GIS files, timesheets); next-page tokens exist for all but the EPA query.
    CalFire/UCF: NO CalFire or Urban & Community Forestry application found. The query matched only generic full-text hits; try `title contains 'Forest'` next time.
    Caltrans hits are dominated by Modesto SR-132 regulatory records (excluded). No Caltrans Sustainable Transportation Planning application found; Oakland STEP is represented by the grant-acceptance agenda report and the task 2.3 urban-greening material.
    Project cases now covered by primary sources: Prescott (proposal, final and planting reports, modeling), Stockton (James's 2023 deck, the Little Manila claim report, the TCC Stockton Rising annual report, an AI-drafted Apr 2026 progress report), Oakland STEP, Green Heart (2022 final report), DePave LA (final Google Doc), AdaptOS/NSF (Phase II description + award letter), UGG (Richmond 2021 submitted, West Oakland 2020), EPA (AQ final submission, AirSense, TTF CCG).
    Live, parallel: West Oakland TCC Round 6 (Sept 2026) Strategy 7 urban-greening answers; watch for cross-application reuse.

