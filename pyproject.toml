[project]
name = "adapt-rfp"
version = "0.0.1"
description = "Hyphae proposal-prose library: ingest, library, solicitation models, composition, and QA signals"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "pydantic>=2",
    "pyyaml>=6",
    "pypandoc-binary>=1.13",   # bundles the pandoc binary, so no pacman/AUR install needed
    "ruamel-yaml>=0.18",
    "anthropic>=1.8.0",
    "openpyxl>=3.1.5",
    "pypdf>=6.19.0",
]

[project.scripts]
adapt-rfp = "adapt_rfp.cli:main"

[dependency-groups]
dev = ["pytest>=8"]
# Heavier groups are added when a module needs them (DR-0006):
#   nlp    = spacy (+ en_core_web_sm wheel), textstat, rapidfuzz, datasketch
#   models = torch (CUDA), transformers, sentence-transformers  — for WQRM / CoLA / embeddings

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/adapt_rfp"]
